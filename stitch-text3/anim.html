<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stitch Text Clip 3</title>
<style>
  html, body { margin: 0; padding: 0; background: #1E1E1E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Minimal explanatory text animation — 1920x1080, 24fps, 10s.
// Palette: white text only; red (#E53935) only for graphic elements.
const W = 1920, H = 1080, DURATION = 10;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const BG = '#1E1E1E', WHITE = '#FFFFFF', RED = '#E53935';
const FAMILY = '"Liberation Sans", "DejaVu Sans", Arial, sans-serif';
const font = px => `bold ${px}px ${FAMILY}`;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

// fade + small upward slide in, soft fade out
const IN = 0.35, OUT = 0.25;
function vis(t, a, b) {
  const kin = eOut(prog(t, a, a + IN));
  const kout = b == null ? 0 : eIO(prog(t, b, b + OUT));
  return { alpha: kin * (1 - kout), dy: (1 - kin) * 18 };
}
const textW = (s, px) => { ctx.font = font(px); return ctx.measureText(s).width; };

function outlineBox(x, y, w, h, r, alpha, lw = 2.5) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  ctx.lineWidth = lw; ctx.strokeStyle = RED; ctx.stroke(); ctx.restore();
}
function solidBox(x, y, w, h, r, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = RED; ctx.fill(); ctx.restore();
}
function text(str, px, x, y, alpha, align = 'center') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font(px); ctx.fillStyle = WHITE;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y); ctx.restore();
}
function wrap(str, px, maxW) {
  ctx.font = font(px); const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  lines.push(cur); return lines;
}
// typewriter text, left-aligned at (x, cy), white blinking cursor
function typed(str, px, x, cy, t, t0, cps, alpha) {
  if (alpha <= 0) return;
  const n = clamp(Math.floor((t - t0) * cps), 0, str.length);
  const shown = t < t0 ? '' : str.slice(0, n);
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = font(px); ctx.fillStyle = WHITE;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(shown, x, cy);
  const typing = t >= t0 && n < str.length;
  if (typing || Math.floor(t / 0.5) % 2 === 0) ctx.fillRect(x + ctx.measureText(shown).width + 6, cy - px * 0.55, Math.max(3, px * 0.07), px * 1.1);
  ctx.restore();
}

// ---------------- timeline ----------------
const T = { s1: 0.0, s2: 1.5, s3: 2.6, s4: 3.75, s5: 5.0, s6: 6.6, s7: 7.85 };
const S1 = 'comenta aquí abajo Google';
const WORD = 'Google';
const CHIP_A = 'PDF', CHIP_B = 'vídeo';
const S4 = 'donde yo te explico exactamente';
const S5A = 'cómo puedes generar entre ', S5B = '300 y $500 al día';
const S6 = 'usando inteligencia artificial';
const S7 = 'comenta aquí abajo Google y te lo hago llegar ahora mismo';

const BOX_W = 720, BOX_H = 130, CHIP_PX = 50, CHIP_H = 100, CHIP_PAD = 44, CHIP_GAP = 30;
function centeredLines(str, px, cy, alpha, maxW = 1500) {
  const lines = wrap(str, px, maxW), lh = px * 1.25, top = cy - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => text(l, px, W / 2, top + i * lh, alpha));
}
// comment input box: outline red, filled with the background so chips can emerge from behind it
function commentBox(cx, cy, alpha, t, t0) {
  if (alpha <= 0) return;
  const x = cx - BOX_W / 2, y = cy - BOX_H / 2;
  ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.roundRect(x, y, BOX_W, BOX_H, 30);
  ctx.fillStyle = BG; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = RED; ctx.stroke(); ctx.restore();
  typed(WORD, 64, x + 52, cy, t, t0, 14, alpha);
}

function render(t) {
  t = clamp(t, 0, DURATION);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // layout of the box + chips row (box shifts left while the chips slide out to its right)
  const wa = textW(CHIP_A, CHIP_PX) + CHIP_PAD * 2, wb = textW(CHIP_B, CHIP_PX) + CHIP_PAD * 2;
  const rowW = BOX_W + CHIP_GAP + wa + CHIP_GAP + wb;
  const shift = eIO(prog(t, T.s2, T.s2 + 0.5));
  const boxCx = lerp(W / 2, (W - rowW) / 2 + BOX_W / 2, shift), rowY = 560;

  // 1. top text + comment box typing "Google"
  {
    const v = vis(t, T.s1, T.s4 - OUT);
    text(S1, 70, W / 2, 330 + v.dy, v.alpha);
  }
  // 2–3. chips slide out from behind the comment box; dim in scene 4, gone in scene 5
  {
    const dim = lerp(1, 0.25, eIO(prog(t, T.s4, T.s4 + 0.4)));
    const gone = 1 - eIO(prog(t, T.s5 - OUT, T.s5));
    const boxRight = boxCx + BOX_W / 2;
    // vídeo emerges from behind PDF, PDF from behind the box; draw back-to-front
    const xa = boxRight + CHIP_GAP, xb = xa + wa + CHIP_GAP;
    const chips = [[CHIP_B, wb, xa + wa - wb, xb, T.s3], [CHIP_A, wa, boxRight - wa - 10, xa, T.s2 + 0.15]];
    chips.forEach(([s, w, xStart, xEnd, a0]) => {
      const k = eOut(prog(t, a0, a0 + 0.55));
      if (k <= 0) return;
      const x = lerp(xStart, xEnd, k);
      const a = clamp(k * 2.5) * dim * gone;
      ctx.save(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.roundRect(x, rowY - CHIP_H / 2, w, CHIP_H, 22); ctx.fillStyle = BG; ctx.fill(); ctx.restore();
      solidBox(x, rowY - CHIP_H / 2, w, CHIP_H, 22, a);
      text(s, CHIP_PX, x + w / 2, rowY, a);
    });
    const vb = vis(t, T.s1 + 0.2, T.s5 - OUT);
    commentBox(boxCx, rowY + vb.dy, vb.alpha * dim, t, T.s1 + 0.55);
  }
  // 4. "donde yo te explico exactamente" at the top
  {
    const v = vis(t, T.s4 + 0.2, T.s5 - OUT);
    text(S4, 70, W / 2, 330 + v.dy, v.alpha);
  }
  // 5. phrase with a red highlight bar drawn behind "300 y $500 al día"
  {
    const v = vis(t, T.s5, T.s6 - OUT);
    const px = 70, full = S5A + S5B, x0 = (W - textW(full, px)) / 2, cy = 540 + v.dy;
    const hx = x0 + textW(S5A, px) - 16, hw = textW(S5B, px) + 32, hh = px * 1.3;
    const k = eIO(prog(t, T.s5 + 0.4, T.s5 + 0.95));
    if (k > 0) solidBox(hx, cy - hh / 2, hw * k, hh, 14, v.alpha);
    text(full, px, x0, cy, v.alpha, 'left');
  }
  // 6. centered
  {
    const v = vis(t, T.s6, T.s7 - OUT);
    text(S6, 76, W / 2, 540 + v.dy, v.alpha);
  }
  // 7. full phrase above + comment box returns typing "Google" (holds to the end)
  {
    const v = vis(t, T.s7, null);
    centeredLines(S7, 66, 330 + v.dy, v.alpha, 1400);
    const vb = vis(t, T.s7 + 0.3, null);
    commentBox(W / 2, 600 + vb.dy, vb.alpha, t, T.s7 + 0.7);
  }
}
window.render = render; window.DURATION = DURATION;

if (!location.search.includes('render')) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; };
  fit(); addEventListener('resize', fit);
  const start = performance.now();
  (function loop() { render(((performance.now() - start) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
