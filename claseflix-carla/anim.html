<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Claseflix · Carla</title>
<style>
  @font-face { font-family: 'D'; src: local('Inter Display Black'), local('InterDisplay-Black'); font-weight: 900; }
  @font-face { font-family: 'D'; src: local('Inter Display ExtraBold'), local('InterDisplay-ExtraBold'); font-weight: 800; }
  @font-face { font-family: 'D'; src: local('Inter Display Bold'), local('InterDisplay-Bold'); font-weight: 700; }
  @font-face { font-family: 'D'; src: local('Inter Display SemiBold'), local('InterDisplay-SemiBold'); font-weight: 600; }
  :root {
    --red: #DA0B22; --red2: #C00A24; --mag: #B5287E; --pur: #6E1A4F; --org: #FF3B45;
    --cream: #F8F4F0; --ink: #1B1B1F; --blush: #FBE0E3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); font-family: 'D', 'Inter', sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .bg-cream { background: var(--cream); }
  .bg-red { background: radial-gradient(120% 80% at 30% 20%, #EC1C36 0%, var(--red) 45%, #AE0820 100%); color: #fff; }
  .abs { position: absolute; }
  .title { position: absolute; left: 70px; right: 70px; text-align: center; z-index: 10; }
  .sm { font-weight: 800; font-size: 64px; letter-spacing: -0.02em; line-height: 1.05; color: var(--ink); }
  .bg-red .sm { color: #fff; }
  .big { font-weight: 900; font-size: 150px; letter-spacing: -0.035em; line-height: 0.98; color: var(--red); white-space: nowrap; display: inline-block; }
  .bg-red .big { color: #fff; }
  .w { display: inline-block; will-change: transform, filter, opacity; }
  .line { display: block; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); }
  .char { position: absolute; left: 50%; transform-origin: 50% 100%; }
  .char img { display: block; width: 100%; }

  /* badges / chips */
  .badge { position: absolute; width: 170px; height: 170px; border-radius: 44px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, var(--org) 0%, var(--red) 55%, var(--mag) 100%); box-shadow: 0 18px 40px rgba(180,20,40,.28); }
  .badge svg { width: 96px; height: 96px; }
  .badge .mk { position: absolute; right: -16px; top: -16px; width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--red);
    font-weight: 900; font-size: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .badge .lb { position: absolute; top: 186px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-weight: 800; font-size: 34px; color: var(--ink); }
  .chip { position: absolute; display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 26px; padding: 18px 30px 18px 18px;
    box-shadow: 0 16px 40px rgba(40,10,20,.16); font-weight: 800; font-size: 40px; white-space: nowrap; }
  .chip i { width: 68px; height: 68px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, var(--org), var(--red) 55%, var(--mag)); }
  .chip i svg { width: 40px; height: 40px; }

  /* laptop */
  .laptop { position: absolute; width: 900px; left: 90px; }
  .laptop .scr { width: 820px; height: 520px; margin: 0 auto; background: #121216; border: 18px solid #23232a; border-bottom-width: 26px; border-radius: 30px 30px 8px 8px; overflow: hidden; position: relative; }
  .laptop .base { width: 900px; height: 34px; background: linear-gradient(#d9d9de, #a9a9b2); border-radius: 4px 4px 30px 30px; position: relative; }
  .laptop .base:after { content: ''; position: absolute; left: 50%; top: 0; width: 140px; height: 12px; transform: translateX(-50%); background: #9a9aa3; border-radius: 0 0 12px 12px; }
  .dash { position: absolute; inset: 0; padding: 20px 24px; color: #fff; font-family: 'D'; }
  .dash .top { display: flex; align-items: center; justify-content: space-between; height: 34px; }
  .dash .top img { height: 26px; filter: brightness(0) invert(1); }
  .dash .top .logo-c { display: flex; align-items: center; gap: 8px; }
  .dash .top .logo-c img.ic { filter: none; height: 30px; }
  .dash .top .logo-c span { font-weight: 800; font-size: 22px; letter-spacing: .04em; }
  .dash .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(145deg, var(--org), var(--mag)); }
  .dash .hero { margin-top: 14px; height: 168px; border-radius: 14px; position: relative; overflow: hidden;
    background: linear-gradient(110deg, #3a0d2a 0%, #8f1239 45%, #DA0B22 100%); padding: 20px 22px; }
  .dash .hero b { display: block; font-weight: 900; font-size: 34px; line-height: 1.05; width: 420px; }
  .dash .hero small { display: block; margin-top: 8px; font-weight: 600; font-size: 16px; opacity: .85; }
  .dash .hero .play { position: absolute; right: 30px; top: 46px; width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.95); }
  .dash .hero .play:after { content: ''; position: absolute; left: 30px; top: 22px; border-left: 26px solid var(--red); border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  .dash .prog { margin-top: 12px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .dash .prog div { height: 100%; width: 10%; background: linear-gradient(90deg, var(--org), var(--red)); }
  .dash .row-t { margin-top: 14px; font-weight: 800; font-size: 18px; opacity: .9; }
  .dash .row { display: flex; gap: 12px; margin-top: 10px; }
  .dash .card { flex: 1; height: 112px; border-radius: 10px; position: relative; overflow: hidden; padding: 10px; font-weight: 800; font-size: 15px; display: flex; align-items: flex-end; }

  /* phone */
  .phone { position: absolute; width: 480px; height: 980px; border-radius: 74px; background: #15151a; padding: 18px; box-shadow: 0 40px 80px rgba(60,10,20,.25); }
  .phone .in { width: 100%; height: 100%; border-radius: 58px; overflow: hidden; position: relative; background: #fff; }
  .phone .notch { position: absolute; top: 18px; left: 50%; width: 150px; height: 42px; transform: translateX(-50%); background: #15151a; border-radius: 24px; z-index: 5; }

  .post { position: absolute; left: 30px; right: 30px; height: 300px; border-radius: 26px; background: #fff; box-shadow: 0 14px 34px rgba(0,0,0,.14); overflow: hidden; }
  .post .img { position: absolute; left: 0; right: 0; top: 0; height: 210px; }
  .post .meta { position: absolute; left: 22px; bottom: 22px; right: 22px; display: flex; align-items: center; gap: 14px; }
  .post .meta .h { width: 40px; height: 40px; }
  .post .meta .bar { flex: 1; height: 14px; border-radius: 7px; background: #eee; }

  .cal { position: absolute; display: grid; grid-template-columns: repeat(7, 96px); gap: 14px; }
  .cal div { height: 82px; border-radius: 18px; background: #EEE6E2; }

  .avatar { position: absolute; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.15); border: 8px solid #fff; }
  .avatar svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="timemap.js"></script>
<script>
const W = 1080, H = 1920;
window.DURATION = 50.7;
const stage = document.getElementById('stage');

/* ---------- helpers ---------- */
const cl = x => Math.max(0, Math.min(1, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = x => { x = cl(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

// Blur + rise reveal (like the reference's kinetic titles)
function rv(el, t, a, o = {}) {
  const d = o.d ?? 0.42, y = o.y ?? 46, bl = o.blur ?? 16;
  const p = cl((t - a) / d), e = eo(p);
  el.style.opacity = p <= 0 ? 0 : Math.min(1, p * 1.8);
  const sc = o.scale ? lerp(o.scale, 1, e) : 1;
  el.style.transform = `translateY(${(1 - e) * y}px) scale(${sc})`;
  el.style.filter = `blur(${(1 - e) * bl}px)`;
}
// Pop in with overshoot
function pop(el, t, a, o = {}) {
  const d = o.d ?? 0.5, p = cl((t - a) / d);
  const s = p <= 0 ? 0 : eb(p);
  el.style.opacity = p <= 0 ? 0 : Math.min(1, p * 3);
  el.style.transform = `${o.pre || ''} scale(${s}) rotate(${(1 - eo(p)) * (o.rot ?? 0)}deg)`;
}
function hide(el) { el.style.opacity = 0; }

// words -> spans
function words(text, cls = '') { return text.split(' ').map(w => `<span class="w ${cls}">${w}</span>`).join(' '); }
function fit(el, maxW) {
  const fs = parseFloat(getComputedStyle(el).fontSize);
  const w = el.scrollWidth;
  if (w > maxW) el.style.fontSize = (fs * maxW / w) + 'px';
}

/* ---------- icons (white line glyphs) ---------- */
const S = 'fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"';
const IC = {
  post: `<svg viewBox="0 0 100 100" ${S}><rect x="16" y="16" width="68" height="68" rx="14"/><circle cx="38" cy="40" r="8"/><path d="M18 74l22-20 16 14 10-8 18 16"/></svg>`,
  mega: `<svg viewBox="0 0 100 100" ${S}><path d="M18 42v18h14l30 18V24L32 42z"/><path d="M74 38c5 4 5 20 0 24"/><path d="M34 62l6 18"/></svg>`,
  ai: `<svg viewBox="0 0 100 100" ${S}><path d="M44 14l7 20 20 7-20 7-7 20-7-20-20-7 20-7z"/><path d="M76 58l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>`,
  clock: `<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="52" r="32"/><path d="M50 34v18l12 8"/></svg>`,
  pen: `<svg viewBox="0 0 100 100" ${S}><path d="M22 78l6-20 38-38 14 14-38 38z"/><path d="M58 28l14 14"/></svg>`,
  bolt: `<svg viewBox="0 0 100 100" ${S}><path d="M56 12L24 56h24l-6 32 34-46H52z"/></svg>`,
  chart: `<svg viewBox="0 0 100 100" ${S}><path d="M18 80h66"/><path d="M28 70V54M46 70V40M64 70V28"/><path d="M24 40l20-14 14 8 22-16"/></svg>`,
  play: `<svg viewBox="0 0 100 100" ${S}><rect x="12" y="22" width="76" height="56" rx="12"/><path d="M42 38l20 12-20 12z" fill="#fff"/></svg>`,
  heart: `<svg viewBox="0 0 100 100"><path d="M50 84S14 62 14 38c0-12 9-22 21-22 7 0 12 4 15 9 3-5 8-9 15-9 12 0 21 10 21 22 0 24-36 46-36 46z" fill="#DA0B22"/></svg>`,
};
function avatar(bg, skin, hair) {
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><circle cx="50" cy="42" r="18" fill="${skin}"/>
  <path d="M32 40c0-14 8-22 18-22s18 8 18 22c-4-8-10-10-18-10s-14 2-18 10z" fill="${hair}"/>
  <path d="M18 100c2-20 16-30 32-30s30 10 32 30z" fill="#fff" opacity=".9"/></svg>`;
}

/* ---------- scene factory ---------- */
const scenes = [];
// nt = true: the scene's times are written against the current voiceover directly;
// otherwise they are in the first take's time and get mapped through TIMEMAP.
function scene(s, e, cls, build, update, nt = false) {
  const el = document.createElement('div'); el.className = 'scene ' + cls; stage.appendChild(el);
  const ctx = build(el) || {};
  scenes.push({ s, e, el, ctx, update, nt });
}
function toOld(tn) {
  const M = window.TIMEMAP;
  for (let i = 0; i < M.length - 1; i++) {
    const [o0, n0] = M[i], [o1, n1] = M[i + 1];
    if (tn <= n1) return o0 + (o1 - o0) * (tn - n0) / (n1 - n0);
  }
  return tn;
}
// title block: small line + big line
function title(el, top, sm, big, o = {}) {
  const t = h(`<div class="title" style="top:${top}px">
      ${sm ? `<div class="line sm">${words(sm)}</div>` : ''}
      <div class="line"><span class="big" style="${o.bigStyle || ''}">${o.letters ? big.split('').map(c => `<span class="w">${c === ' ' ? '&nbsp;' : c}</span>`).join('') : words(big)}</span></div>
    </div>`);
  el.appendChild(t);
  const bigEl = t.querySelector('.big');
  requestAnimationFrame(() => {});
  return { t, smW: [...t.querySelectorAll('.sm .w')], bigEl, bigW: [...t.querySelectorAll('.big .w')] };
}
// reveal small words starting at times[] (or evenly), big words at times
function playTitle(tt, t, smTimes, bigTimes, o = {}) {
  tt.smW.forEach((w, i) => rv(w, t, smTimes[Math.min(i, smTimes.length - 1)] + (i >= smTimes.length ? (i - smTimes.length + 1) * 0.08 : 0), { y: 30, blur: 12, d: 0.35 }));
  tt.bigW.forEach((w, i) => rv(w, t, bigTimes[Math.min(i, bigTimes.length - 1)] + (i >= bigTimes.length ? (i - bigTimes.length + 1) * (o.stagger ?? 0.1) : 0), { y: o.y ?? 70, blur: 20, d: 0.45, scale: o.scale }));
}
// subtle push-in so nothing is ever static
function push(el, t, s, e, amt = 0.035) { el.style.transform = `scale(${1 + amt * cl((t - s) / (e - s))})`; }

/* ======================================================================
   SCENE A  0.00 – 4.10  "Esta es Carla" / "Tiene su propio negocio"
   ====================================================================== */
scene(0, 4.10, 'bg-cream', el => {
  const wrap = h(`<div class="abs" style="inset:0"></div>`); el.appendChild(wrap);
  const blob1 = h(`<div class="blob" style="width:900px;height:900px;left:420px;top:760px;background:radial-gradient(circle,#F9CDD2 0%,#FBE0E3 55%,rgba(251,225,222,0) 72%)"></div>`);
  const blob2 = h(`<div class="blob" style="width:620px;height:620px;left:-260px;top:1100px;background:radial-gradient(circle,#F7C9D9 0%,rgba(247,201,217,0) 70%)"></div>`);
  // storefront awning (business decor)
  const shop = h(`<svg class="abs" style="left:-30px;top:1080px;width:300px;opacity:0" viewBox="0 0 360 420">
      <rect x="40" y="120" width="280" height="290" rx="10" fill="#F7C5CB"/>
      <rect x="80" y="210" width="90" height="200" rx="8" fill="#F0939C"/>
      <rect x="200" y="210" width="90" height="90" rx="8" fill="#fff" opacity=".7"/>
      <path d="M20 40h320l10 80H10z" fill="#DA0B22"/>
      <path d="M20 40h53l-8 80H10zM126 40h54v80h-62zM233 40h53l11 80h-62z" fill="#fff" opacity=".9"/>
      <path d="M10 120c0 22 22 22 27 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0 5 22 27 22 31 0" fill="#DA0B22"/></svg>`);
  const bars = h(`<div class="abs" style="left:720px;top:900px;width:300px;height:300px"></div>`);
  const barEls = [0, 1, 2, 3].map(i => { const b = h(`<div class="abs" style="left:${i * 70}px;bottom:0;width:52px;border-radius:14px 14px 4px 4px;background:linear-gradient(${['#F8B4BA', '#F27580', '#EA3440', '#DA0B22'][i]},${['#F8B4BA', '#F27580', '#EA3440', '#DA0B22'][i]})"></div>`); bars.appendChild(b); return b; });
  const arrow = h(`<svg class="abs" style="left:-10px;top:-40px;width:320px;height:260px;overflow:visible" viewBox="0 0 320 260"><path id="ar" d="M10 230 L110 150 L170 180 L300 40" fill="none" stroke="#B5287E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path id="ah" d="M250 36 L304 36 L304 90" fill="none" stroke="#B5287E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  bars.appendChild(arrow);
  [blob1, blob2, shop, bars].forEach(x => wrap.appendChild(x));
  const ch = h(`<div class="char" style="width:900px;top:820px;margin-left:-450px"><img src="assets/carla_laptop.png"></div>`); wrap.appendChild(ch);
  const t1 = title(wrap, 300, 'Esta es', 'Carla');
  const t2 = title(wrap, 300, 'Tiene su propio', 'Negocio');
  return { wrap, blob1, blob2, shop, bars, barEls, arrow, ch, t1, t2 };
}, (c, t) => {
  push(c.wrap, t, 0, 4.1, 0.03);
  // Carla rises in
  const p = cl((t - 0.05) / 0.7);
  c.ch.style.opacity = p > 0 ? 1 : 0;
  c.ch.style.transform = `translateY(${(1 - eb(p)) * 500 + Math.sin(t * 2.2) * 6}px)`;
  c.blob1.style.opacity = eo((t - 0.1) / 0.6); c.blob1.style.transform = `scale(${lerp(.6, 1, eo((t - .1) / .8))})`;
  const showT1 = t < 1.18;
  c.t1.t.style.display = showT1 ? '' : 'none'; c.t2.t.style.display = showT1 ? 'none' : '';
  if (showT1) playTitle(c.t1, t, [0.12, 0.22], [0.38]);
  else playTitle(c.t2, t, [1.2, 1.56, 1.79], [2.22]);
  // business decor
  rv(c.shop, t, 1.9, { y: 80, blur: 10, d: 0.5 });
  c.blob2.style.opacity = eo((t - 1.9) / .6);
  // growth "y quiere que crezca"
  c.bars.style.opacity = t > 2.8 ? 1 : 0;
  const hs = [70, 120, 180, 250];
  c.barEls.forEach((b, i) => b.style.height = (hs[i] * eb((t - 2.85 - i * 0.1) / 0.45)) + 'px');
  const ar = c.arrow.querySelector('#ar'), ah = c.arrow.querySelector('#ah');
  const L = 420, pa = eo((t - 3.25) / 0.6);
  ar.style.strokeDasharray = L; ar.style.strokeDashoffset = L * (1 - pa);
  ah.style.strokeDasharray = 120; ah.style.strokeDashoffset = 120 * (1 - eo((t - 3.75) / 0.25));
});

/* ======================================================================
   SCENE B  4.10 – 6.78  red: "Pero todos los días / La misma pregunta"
   ====================================================================== */
scene(4.10, 6.78, 'bg-red', el => {
  const wrap = h(`<div class="abs" style="inset:0"></div>`); el.appendChild(wrap);
  const ring = h(`<div class="abs" style="left:540px;top:960px;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;border:2px solid rgba(255,255,255,.18)"></div>`);
  const ring2 = h(`<div class="abs" style="left:540px;top:960px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;border:2px solid rgba(255,255,255,.22)"></div>`);
  wrap.appendChild(ring); wrap.appendChild(ring2);
  const tt = title(wrap, 760, 'Pero todos los días', 'La misma', { });
  const tt2 = title(wrap, 1000, '', 'pregunta');
  return { wrap, tt, tt2, ring, ring2 };
}, (c, t) => {
  push(c.wrap, t, 4.1, 6.78, 0.05);
  c.ring.style.transform = `scale(${lerp(.4, 1, eo((t - 4.1) / 1.2))})`;
  c.ring2.style.transform = `scale(${lerp(.3, 1, eo((t - 4.2) / 1.2))})`;
  playTitle(c.tt, t, [4.14, 4.44, 4.68, 4.86], [5.49, 5.64]);
  playTitle(c.tt2, t, [0], [5.9]);
});

/* ======================================================================
   SCENE C  6.78 – 9.15  "¿Cómo atraer más / Clientes?"
   ====================================================================== */
scene(6.78, 9.15, 'bg-cream', el => {
  const wrap = h(`<div class="abs" style="inset:0"></div>`); el.appendChild(wrap);
  const glow = h(`<div class="blob" style="width:1100px;height:1100px;left:-10px;top:500px;background:radial-gradient(circle,#FBDAD6 0%,rgba(251,225,222,0) 65%)"></div>`); wrap.appendChild(glow);
  const tt = title(wrap, 760, '¿Cómo atraer más', 'Clientes?');
  const av = [
    [110, 420, '#FBD3D8', '#F2C3A0', '#3B2A20'], [800, 380, '#E8D7F5', '#E9B993', '#1E1E1E'], [880, 1200, '#D6ECF7', '#C98E68', '#2E1C12'],
    [120, 1240, '#FBD5DC', '#F0C9A8', '#8A4B2A'], [470, 1430, '#FFF0C2', '#D7A07A', '#151515'],
  ].map(([x, y, bg, sk, hr]) => { const a = h(`<div class="avatar" style="left:${x}px;top:${y}px">${avatar(bg, sk, hr)}</div>`); wrap.appendChild(a); return a; });
  return { wrap, tt, av, glow };
}, (c, t) => {
  push(c.wrap, t, 6.78, 9.15, 0.04);
  playTitle(c.tt, t, [6.84, 7.12, 7.32, 7.66], [7.91]);
  const at = [7.55, 7.72, 7.9, 8.08, 8.26];
  c.av.forEach((a, i) => { pop(a, t, at[i], { rot: i % 2 ? 12 : -12 }); a.style.transform += ` translateY(${Math.sin(t * 2 + i) * 8}px)`; });
});

/* ======================================================================
   SCENE D  9.15 – 18.62  Carla thinking + pain-point icons
   ====================================================================== */
scene(9.15, 18.62, 'bg-cream', el => {
  const wrap = h(`<div class="abs" style="inset:0"></div>`); el.appendChild(wrap);
  const blob = h(`<div class="blob" style="width:1000px;height:1000px;left:40px;top:780px;background:radial-gradient(circle,#F9CDD2 0%,#FBE0E3 50%,rgba(251,225,222,0) 70%)"></div>`); wrap.appendChild(blob);
  const ch = h(`<div class="char" style="width:740px;top:1010px;margin-left:-410px"><img src="assets/carla_think.png"></div>`); wrap.appendChild(ch);
  const tt = title(wrap, 300, 'Sabe que necesita crear', 'Contenido');
  const tt2 = title(wrap, 300, 'Pero no sabe…', '¿Por dónde empezar?', { });
  const mk = (x, y, icon, m, label) => { const b = h(`<div class="badge" style="left:${x}px;top:${y}px">${IC[icon]}<div class="mk">${m}</div><div class="lb">${label}</div></div>`); wrap.appendChild(b); return b; };
  const b = [
    mk(110, 640, 'post', '?', 'Qué publicar'),
    mk(790, 600, 'mega', '!', 'Vender en redes'),

  const arr = h(`<svg class="abs" style="left:760px;top:520px;width:220px;height:220px;overflow:visible" viewBox="0 0 220 220"><path id="a1" d="M20 200 C 60 120, 110 80, 190 30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path id="a2" d="M130 26 L194 26 L194 90" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  wrap.appendChild(arr);
  return { wrap, tt, o1: ov.querySelector('#o1'), a1: arr.querySelector('#a1'), a2: arr.querySelector('#a2') };
}, (c, t) => {
  push(c.wrap, t, 43.45, 45.2, 0.05);
  playTitle(c.tt, t, [43.49, 43.73, 44.11], [44.24]);
  c.o1.style.strokeDasharray = 100; c.o1.style.strokeDashoffset = 100 * (1 - eio((t - 44.5) / 0.55));
  c.a1.style.strokeDasharray = 260; c.a1.style.strokeDashoffset = 260 * (1 - eo((t - 43.8) / 0.4));
  c.a2.style.strokeDasharray = 140; c.a2.style.strokeDashoffset = 140 * (1 - eo((t - 44.15) / 0.25));
}, true);

/* ======================================================================
   SCENE P  45.92 – 50.60  End card: logo + "Aprende IA y haz crecer tu negocio"
   ====================================================================== */
scene(45.20, 50.70, 'bg-cream', el => {
  const wrap = h(`<div class="abs" style="inset:0"></div>`); el.appendChild(wrap);
  const glow = h(`<div class="abs" style="left:540px;top:914px;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;background:radial-gradient(circle,rgba(227,18,11,.13) 0%,rgba(181,40,126,.07) 35%,rgba(255,255,255,0) 62%)"></div>`);
  wrap.appendChild(glow);
  const logo = h(`<img class="abs" src="assets/claseflix_logo.png" style="left:110px;top:780px;width:860px">`); wrap.appendChild(logo);
  const tag1 = h(`<div class="title sm" style="top:1060px;font-size:62px">${words('Aprende IA y')}</div>`); wrap.appendChild(tag1);
  const tag2 = h(`<div class="title" style="top:1140px"><span class="big" style="font-size:96px">${words('crea sin límites')}</span></div>`); wrap.appendChild(tag2);
  return { wrap, glow, logo, tag1: [...tag1.querySelectorAll('.w')], tag2: [...tag2.querySelectorAll('.w')] };
}, (c, t) => {
  push(c.wrap, t, 45.2, 50.7, 0.04);
  c.glow.style.transform = `scale(${lerp(.3, 1, eo((t - 45.3) / 1.0))})`;
  rv(c.logo, t, 45.45, { d: 0.55, y: 40, blur: 18, scale: 0.7 });
  c.logo.style.transform += ` translateY(${Math.sin(t * 2) * 6}px)`;
  const t1 = [46.72, 47.13, 47.49]; c.tag1.forEach((w, i) => rv(w, t, t1[i], { y: 30 }));
  const t2 = [47.59, 47.89, 48.06]; c.tag2.forEach((w, i) => rv(w, t, t2[i], { y: 50, blur: 16 }));
  // final fade to brand cream already; tiny fade-out last 0.25s
  c.wrap.style.opacity = 1 - cl((t - 50.45) / 0.25);
}, true);

/* ---------- fit oversized big words once fonts are ready ---------- */
document.fonts.ready.then(() => {
  stage.querySelectorAll('.scene').forEach(s => s.style.display = 'block');
  stage.querySelectorAll('.big').forEach(b => fit(b, 940));
  stage.querySelectorAll('.scene').forEach(s => s.style.display = 'none');
  window.READY = true;
  if (!location.search.includes('render')) loop();
});

window.render = (t) => {
  for (const sc of scenes) {
    const tt = sc.nt ? t : toOld(t);
    const on = tt >= sc.s && tt < sc.e;
    sc.el.style.display = on ? 'block' : 'none';
    if (on) sc.update(sc.ctx, tt);
  }
};
// live preview in a normal browser
function loop() { const t0 = performance.now(); const f = () => { const t = ((performance.now() - t0) / 1000) % window.DURATION; render(t); requestAnimationFrame(f); }; f(); }
</script>
