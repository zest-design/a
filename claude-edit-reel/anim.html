<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Edit Reel</title>
<style>
  @font-face { font-family: 'Urbanist'; src: url('fonts/Urbanist.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: #0D0D0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------------------
// Claude edit reel — minimal motion design, 1080x1920 (9:16), 30fps, synced
// to the narration of 1006.mp4. render(t) draws one deterministic frame.
//
// Instagram safe grid (from the reference grid image, scaled 900x1600 -> 1080x1920):
//   top bar ........ x 313-762, y 132-216   -> content starts below y 250
//   right buttons .. x 886-1020, y 960-1520 -> content stays within x 200-880
//   bottom bar ..... y >= 1544              -> content ends above y 1530
// Every element and text is centred on x = 540 inside SAFE.
// ---------------------------------------------------------------------------
const W = 1080, H = 1920, DURATION = 77.485;
const SAFE = { x0: 200, x1: 880, y0: 250, y1: 1530 };
const CX = 540, SW = SAFE.x1 - SAFE.x0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  paper: '#F5F5F3', ink: '#0D0D0D', gray: '#8C8C8C', line: '#E2E2DE', white: '#FFFFFF',
  pink: '#F4B8E4', lav: '#C3C1F5', mint: '#C9F7CC', peach: '#FAE3C3', sky: '#CFE9FA',
  clay: '#D97757', cream: '#F4F1EA',
};
const PAST = [C.pink, C.lav, C.mint, C.peach, C.sky];
const F = 'Urbanist, "Inter", sans-serif';

// ---------- math / easing ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eBack = (k, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function font(size, weight = 600) { ctx.font = `${weight} ${size}px ${F}`; }
function measure(s, size, weight = 600, ls = 0) { font(size, weight); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return w; }
function fit(s, weight, maxW, maxSize, ls = 0) { let z = maxSize; while (z > 10 && measure(s, z, weight, ls) > maxW) z -= 2; return z; }
function text(s, x, y, size, weight, color, align = 'center', ls = 0) {
  font(size, weight); ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
// characters revealed at `cps` chars/second from t0
const typed = (s, t, t0, cps = 22) => s.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
const blink = t => (Math.floor(t * 2.2) % 2 === 0);
function caret(x, y, h, color, t) { if (!blink(t)) return; ctx.fillStyle = color; ctx.fillRect(x + 4, y - h / 2, 5, h); }
// typewriter line with caret; returns width drawn
function typeLine(s, x, y, size, weight, color, t, t0, cps, showCaret = true, align = 'center') {
  const shown = typed(s, t, t0, cps);
  const full = measure(s, size, weight);
  const w = measure(shown, size, weight);
  const left = align === 'center' ? x - full / 2 : x;
  if (t >= t0) text(shown, left, y, size, weight, color, 'left');
  if (showCaret && t >= t0) caret(left + w, y, size * 0.95, color, t);
  return w;
}
function wrap(s, size, weight, maxW) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const tryS = cur ? cur + ' ' + w : w; if (measure(tryS, size, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = tryS; }
  if (cur) lines.push(cur); return lines;
}
// pop-in: returns {s: scale, a: alpha}
function pop(t, t0, d = 0.5) { const k = prog(t, t0, t0 + d); return { s: k <= 0 ? 0 : eBack(k), a: clamp(k * 3) }; }
function withPop(t, t0, x, y, fn, d = 0.5) {
  const p = pop(t, t0, d); if (p.a <= 0) return;
  ctx.save(); ctx.globalAlpha *= p.a; ctx.translate(x, y); ctx.scale(p.s, p.s); fn(); ctx.restore();
}
// rise-in from below with fade
function withRise(t, t0, fn, dist = 60, d = 0.55) {
  const k = eExpo(prog(t, t0, t0 + d)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(k * 1.5); ctx.translate(0, (1 - k) * dist); fn(); ctx.restore();
}
function shadow(blur = 40, a = 0.10, oy = 18) { ctx.shadowColor = `rgba(0,0,0,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function chip(label, x, y, bg, fg, size = 34) {
  const w = measure(label, size, 700, 2) + size * 1.4, h = size * 1.9;
  fillRR(x - w / 2, y - h / 2, w, h, h / 2, bg); text(label, x, y + 1, size, 700, fg, 'center', 2);
  return w;
}
// highlighter swipe behind a word (left -> right)
function swipe(x, y, w, h, k, color) { if (k <= 0) return; fillRR(x, y - h / 2, w * eOut(k), h, 14, color); }

// ---------- icons (drawn, no brand logos) ----------
function iconNote(s, color) { // short-video app glyph: music note
  ctx.save(); ctx.scale(s, s); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-14, 22, 17, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-2, 22); ctx.lineTo(-2, -36); ctx.quadraticCurveTo(8, -12, 30, -10); ctx.stroke();
  ctx.restore();
}
function iconCamera(s, color) { // photo app glyph: rounded camera
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = 10;
  rr(-38, -38, 76, 76, 22); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(22, -22, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function iconSearch(s, color) {
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-4, -4, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 7); ctx.lineTo(17, 17); ctx.stroke(); ctx.restore();
}
function iconHeart(s, color) {
  ctx.save(); ctx.scale(s, s); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(0, 18); ctx.bezierCurveTo(-34, -6, -22, -34, 0, -18); ctx.bezierCurveTo(22, -34, 34, -6, 0, 18); ctx.fill(); ctx.restore();
}
function iconCheck(s, color, k = 1, lw = 9) {
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[-16, 0], [-5, 11], [17, -12]];
  const L1 = Math.hypot(11, 11), L2 = Math.hypot(22, 23), L = (L1 + L2) * k;
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  if (L <= L1) ctx.lineTo(-16 + 11 * L / L1, 11 * L / L1);
  else { ctx.lineTo(...pts[1]); const q = (L - L1) / L2; ctx.lineTo(-5 + 22 * q, 11 - 23 * q); }
  ctx.stroke(); ctx.restore();
}
function iconPlay(s, color) { ctx.save(); ctx.scale(s, s); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-12, -16); ctx.lineTo(18, 0); ctx.lineTo(-12, 16); ctx.closePath(); ctx.fill(); ctx.restore(); }
function iconArrowUp(s, color) {
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -14); ctx.moveTo(-12, -2); ctx.lineTo(0, -14); ctx.lineTo(12, -2); ctx.stroke(); ctx.restore();
}
function iconLock(s, color, open = 0) {
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 7;
  fillRR(-20, -4, 40, 30, 7, color);
  ctx.beginPath(); ctx.arc(0, -8 - open * 10, 13, Math.PI, 0); ctx.lineTo(13, -4 - open * 10); ctx.moveTo(-13, -8 - open * 10); ctx.lineTo(-13, -4 - open * 4 - open * 10 * (1 - open)); ctx.stroke();
  ctx.restore();
}
// generic AI spark (8 rounded rays) — stands in for "Claude" without using its logo
function spark(s, color, rot = 0) {
  ctx.save(); ctx.scale(s, s); ctx.rotate(rot); ctx.fillStyle = color;
  for (let i = 0; i < 8; i++) { ctx.save(); ctx.rotate(i * Math.PI / 4); rr(-5, -40, 10, 40, 5); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
// mini "edited video": a 2x2 pastel grid that keeps re-cutting (reference style)
function miniEdit(x, y, w, h, t, seed = 0, dark = false) {
  const g = 8, cw = (w - g) / 2, ch = (h - g) / 2;
  const beat = Math.floor(t * 2.4 + seed);
  for (let i = 0; i < 4; i++) {
    const cx = x + (i % 2) * (cw + g), cy = y + Math.floor(i / 2) * (ch + g);
    const col = PAST[(beat + i * 2) % PAST.length];
    fillRR(cx, cy, cw, ch, 14, (beat + i) % 5 === 0 ? (dark ? '#1C1C1C' : C.ink) : col);
    const kind = (beat + i * 3) % 4;
    ctx.save(); ctx.translate(cx + cw / 2, cy + ch / 2);
    const fg = (beat + i) % 5 === 0 ? C.white : C.ink;
    if (kind === 0) text('Aa', 0, 2, Math.min(cw, ch) * 0.36, 700, fg);
    else if (kind === 1) { ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, Math.min(cw, ch) * 0.2, 0, Math.PI * 2); ctx.fill(); }
    else if (kind === 2) { ctx.fillStyle = hexA(fg === C.ink ? '#0D0D0D' : '#FFFFFF', 0.85); rr(-cw * 0.3, -6, cw * 0.6, 12, 6); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- scenes ----------
// Cue times (seconds) come from aligning the transcript to the narration pauses.
const SCENES = [
  { a: 0.00, b: 7.55, bg: C.paper, draw: sceneFind },
  { a: 7.55, b: 13.70, bg: C.ink, draw: sceneModel },
  { a: 13.70, b: 24.55, bg: C.paper, draw: sceneKey },
  { a: 24.55, b: 35.05, bg: C.cream, draw: sceneClaude },
  { a: 35.05, b: 46.35, bg: C.ink, draw: sceneTimer },
  { a: 46.35, b: 55.75, bg: C.paper, draw: scenePdf },
  { a: 55.75, b: 65.65, bg: C.paper, draw: sceneComment },
  { a: 65.65, b: 74.00, bg: C.ink, draw: sceneBonus },
  { a: 74.00, b: DURATION + 1, bg: C.paper, draw: sceneCta },
];

// 1 · Lo primero... TikTok, Instagram... buscar a alguien que edite como a ti te gusta.
function sceneFind(t) {
  withPop(t, 0.15, CX, 330, () => chip('PASO 1', 0, 0, C.ink, C.white, 30));
  // headline
  const hs = 92;
  withRise(t, 0.9, () => text('Busca un editor', CX, 470, hs, 800, C.ink));
  withRise(t, 1.25, () => {
    const s = 'que te inspire', w = measure(s, hs, 800);
    swipe(CX - w / 2 - 14, 580, w + 28, 104, prog(t, 1.5, 2.1), C.pink);
    text(s, CX, 580, hs, 800, C.ink);
  });
  // app tiles
  const ty = 800;
  withPop(t, 3.2, CX - 150, ty, () => { fillRR(-85, -85, 170, 170, 44, C.ink); iconNote(1.25, C.white); });
  withPop(t, 3.59, CX + 150, ty, () => {
    const g = ctx.createLinearGradient(-85, 85, 85, -85); g.addColorStop(0, C.peach); g.addColorStop(.5, C.pink); g.addColorStop(1, C.lav);
    fillRR(-85, -85, 170, 170, 44, g); iconCamera(1.1, C.ink);
  });
  withRise(t, 3.4, () => text('TikTok', CX - 150, ty + 130, 36, 600, C.ink), 20);
  withRise(t, 3.8, () => text('Instagram', CX + 150, ty + 130, 36, 600, C.ink), 20);
  // search bar
  const sy = 1100, sw = SW;
  withRise(t, 4.3, () => {
    shadow(30, 0.08, 10); fillRR(CX - sw / 2, sy - 52, sw, 104, 52, C.white); noShadow();
    ctx.save(); ctx.translate(CX - sw / 2 + 58, sy); iconSearch(1.3, C.ink); ctx.restore();
    if (t < 4.6) text('Buscar', CX - sw / 2 + 100, sy, 38, 500, C.gray, 'left');
    else typeLine('editor de video', CX - sw / 2 + 100, sy, 40, 600, C.ink, t, 4.6, 16, t < 5.6, 'left');
  });
  // results
  for (let i = 0; i < 3; i++) {
    const y = 1260 + i * 96, t0 = 5.5 + i * 0.22;
    withRise(t, t0, () => {
      const hi = i === 0 && t > 6.6;
      if (hi) fillRR(CX - sw / 2, y - 42, sw, 84, 26, hexA('#F4B8E4', 0.45 * eOut(prog(t, 6.6, 6.9))));
      ctx.fillStyle = PAST[i + 1]; ctx.beginPath(); ctx.arc(CX - sw / 2 + 52, y, 28, 0, Math.PI * 2); ctx.fill();
      fillRR(CX - sw / 2 + 100, y - 18, 260 - i * 50, 14, 7, C.ink);
      fillRR(CX - sw / 2 + 100, y + 8, 180 - i * 30, 10, 5, C.line);
      if (i === 0) withPop(t, 7.0, CX + sw / 2 - 56, y, () => iconHeart(1.15, '#F0428F'), 0.45);
    }, 30, 0.45);
  }
}

// 2 · A mí personalmente me gustó este estilo de edición y es el modelo que voy a usar.
function sceneModel(t) {
  typeLine('Este estilo', CX, 330, 76, 700, C.white, t, 7.65, 14, t < 9.6);
  // phone with the reference edit playing
  const pw = 360, ph = 640, px = CX - pw / 2, py = 430;
  withPop(t, 7.85, CX, py + ph / 2, () => {
    ctx.translate(-pw / 2, -ph / 2);
    fillRR(0, 0, pw, ph, 46, '#1A1A1A');
    ctx.save(); rr(14, 14, pw - 28, ph - 28, 34); ctx.clip();
    fillRR(14, 14, pw - 28, ph - 28, 0, C.paper);
    miniEdit(30, 60, pw - 60, ph - 160, t, 0);
    fillRR(30, ph - 80, (pw - 60) * ((t * 0.18) % 1), 8, 4, C.ink);
    fillRR(30, ph - 80, pw - 60, 8, 4, hexA('#0D0D0D', 0.12));
    ctx.restore();
  }, 0.6);
  // "modelo" in pastel letter boxes (reference: B A N tiles)
  const L = 'MODELO', bw = 98, gap = 12, total = L.length * bw + (L.length - 1) * gap, y = 1250;
  for (let i = 0; i < L.length; i++) {
    const x = CX - total / 2 + i * (bw + gap) + bw / 2;
    withPop(t, 12.25 + i * 0.07, x, y, () => { fillRR(-bw / 2, -66, bw, 132, 22, PAST[i % PAST.length]); text(L[i], 0, 4, 86, 800, C.ink); }, 0.45);
  }
  withRise(t, 12.9, () => text('tu referencia para la IA', CX, 1390, 40, 500, '#BDBDBD'), 20);
}

// 3 · La clave... darle a la IA un punto donde comparar... el resultado que le has pedido.
function sceneKey(t) {
  // "La clave" slam, then settles as a heading
  const k = eIO(prog(t, 14.9, 15.5));
  const size = lerp(170, 64, k), y = lerp(860, 330, k);
  withPop(t, 13.78, CX, y, () => text('La clave', 0, 0, size, 800, C.ink), 0.45);
  withRise(t, 15.95, () => {
    const s = 'Dale a la IA un punto de comparación', z = fit(s, 600, SW, 42);
    text(s, CX, 410, z, 600, C.gray);
  }, 20);
  // two cards
  const cw = 312, chh = 440, cy = 560, gap = 36;
  const lx = CX - gap / 2 - cw, rx = CX + gap / 2;
  withRise(t, 17.8, () => {
    shadow(); fillRR(lx, cy, cw, chh, 32, C.white); noShadow();
    miniEdit(lx + 22, cy + 22, cw - 44, chh - 120, 0.0, 0);
    text('Referencia', lx + cw / 2, cy + chh - 48, 36, 700, C.ink);
  });
  withRise(t, 18.25, () => {
    shadow(); fillRR(rx, cy, cw, chh, 32, C.white); noShadow();
    // the user's video converges to the reference while the meter fills
    const m = eIO(prog(t, 20.2, 23.6));
    ctx.save(); ctx.globalAlpha *= 1 - m; miniEdit(rx + 22, cy + 22, cw - 44, chh - 120, 3.3 + Math.floor(t * 3) / 3, 2); ctx.restore();
    ctx.save(); ctx.globalAlpha *= m; miniEdit(rx + 22, cy + 22, cw - 44, chh - 120, 0.0, 0); ctx.restore();
    text('Tu video', rx + cw / 2, cy + chh - 48, 36, 700, C.ink);
  });
  // compare badge between cards
  withPop(t, 19.4, CX, cy + chh / 2 - 40, () => {
    fillRR(-44, -44, 88, 88, 44, C.ink);
    ctx.strokeStyle = C.white; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-18, -8); ctx.lineTo(18, -8); ctx.moveTo(8, -18); ctx.lineTo(18, -8);
    ctx.moveTo(18, 10); ctx.lineTo(-18, 10); ctx.moveTo(-8, 20); ctx.lineTo(-18, 10); ctx.stroke();
  });
  // match meter
  const my = 1140, mw = SW - 40;
  withRise(t, 19.9, () => {
    const pct = Math.round(lerp(18, 100, eIO(prog(t, 20.2, 23.6))));
    text('Coincidencia', CX - mw / 2, my - 50, 36, 600, C.ink, 'left');
    text(pct + '%', CX + mw / 2, my - 50, 40, 800, C.ink, 'right');
    fillRR(CX - mw / 2, my, mw, 26, 13, C.line);
    fillRR(CX - mw / 2, my, Math.max(26, mw * pct / 100), 26, 13, pct >= 100 ? '#53C76A' : C.lav);
  }, 30);
  withPop(t, 23.85, CX, 1330, () => {
    const w = measure('Resultado conseguido', 38, 700) + 130;
    fillRR(-w / 2, -50, w, 100, 50, C.mint);
    ctx.save(); ctx.translate(-w / 2 + 58, 0); iconCheck(1.2, C.ink, eOut(prog(t, 24.0, 24.35))); ctx.restore();
    text('Resultado conseguido', 30, 2, 38, 700, C.ink);
  });
}

// 4 · Entro a Claude, le doy este video y le digo: edita mi video teniendo como referencia...
function sceneClaude(t) {
  // header: spark + name
  withPop(t, 26.9, CX - 120, 340, () => spark(0.95, C.clay, eOut(prog(t, 26.9, 27.8)) * Math.PI / 2), 0.55);
  withRise(t, 27.1, () => text('Claude', CX + 40, 344, 84, 700, C.ink), 30);
  // chat panel
  const px = SAFE.x0 + 14, pw = SW - 28, py = 480, ph = 900;
  withRise(t, 25.2, () => {
    shadow(50, 0.08, 20); fillRR(px, py, pw, ph, 40, C.white); noShadow();
    if (t < 34.5) text('¿En qué te ayudo hoy?', CX, py + 110, 42, 600, hexA('#0D0D0D', 0.35 * (1 - prog(t, 34.2, 34.5))));
    // sent bubble (after send)
    const sent = prog(t, 34.35, 34.85);
    const msg = 'Edita mi video teniendo como referencia el video que te estoy pasando.';
    if (sent > 0) {
      const lines = wrap(msg, 36, 500, pw - 200);
      const bh = 60 + lines.length * 48, bw = pw - 120, by = lerp(py + ph - 260, py + 60, eExpo(sent));
      ctx.save(); ctx.globalAlpha *= clamp(sent * 3);
      fillRR(px + pw - 40 - bw, by, bw, bh + 120, 30, '#F0EDE6');
      fillRR(px + pw - 40 - bw + 30, by + 26, 200, 90, 16, C.ink);
      ctx.save(); ctx.translate(px + pw - 40 - bw + 130, by + 71); iconPlay(1, C.white); ctx.restore();
      lines.forEach((l, i) => text(l, px + pw - 40 - bw + 30, by + 160 + i * 48, 36, 500, C.ink, 'left'));
      ctx.restore();
      // Claude starts thinking
      withPop(t, 34.8, px + 80, by + bh + 200, () => spark(0.6, C.clay, t * 2), 0.4);
    }
    // input box
    const ix = px + 30, iw = pw - 60, iy = py + ph - 330, ih = 300;
    ctx.globalAlpha *= 1 - sent;
    fillRR(ix, iy, iw, ih, 30, C.cream);
    // attachment chip flies in on "le voy a dar este video"
    const ak = eExpo(prog(t, 28.0, 28.7));
    if (ak > 0) {
      const ax = ix + 26, ay = lerp(py - 300, iy + 24, ak);
      ctx.save(); ctx.globalAlpha *= clamp(ak * 2);
      fillRR(ax, ay, 300, 84, 18, C.white);
      fillRR(ax + 12, ay + 12, 60, 60, 12, C.ink);
      ctx.save(); ctx.translate(ax + 42, ay + 42); iconPlay(0.75, C.white); ctx.restore();
      text('referencia.mp4', ax + 88, ay + 42, 30, 600, C.ink, 'left');
      ctx.restore();
    }
    // prompt typing
    const shown = typed(msg, t, 30.5, 19);
    const lines = wrap(shown || ' ', 36, 500, iw - 60);
    if (!shown) text('Escribe un mensaje…', ix + 30, iy + 150, 34, 500, C.gray, 'left');
    else lines.forEach((l, i) => text(l, ix + 30, iy + 140 + i * 46, 36, 500, C.ink, 'left'));
    if (t > 29.6 && shown.length < msg.length) {
      const last = lines[lines.length - 1];
      caret(ix + 30 + measure(last, 36, 500), iy + 140 + (lines.length - 1) * 46, 40, C.ink, t);
    }
    // send button
    const ready = shown.length >= msg.length;
    const press = 1 - 0.15 * Math.sin(Math.PI * prog(t, 34.25, 34.5));
    ctx.save(); ctx.translate(ix + iw - 60, iy + ih - 56); ctx.scale(press, press);

  }, 40, 0.6);
}

  withRise(t, 40.9, () => text('Lo que hice yo:', CX, 1290, 46, 600, C.white), 30);

// ---------- frame ----------
function sceneAt(t) { let i = 0; while (i < SCENES.length - 1 && t >= SCENES[i + 1].a) i++; return i; }
function drawScene(i, t) {
  const s = SCENES[i];
  ctx.fillStyle = s.bg; ctx.fillRect(0, 0, W, H);
  s.draw(t);
}
// ---------- sync ----------
// Scenes above are authored on a "design" timeline. SYNC maps real narration
// time -> design time (piecewise linear) so every cue lands on the spoken word.
// Pairs are [real seconds, design seconds]; both columns must increase.
const SYNC = window.SYNC || [[0, 0], [DURATION, DURATION]];
function mapT(t, from, to) {
  if (t <= SYNC[0][from]) return t - SYNC[0][from] + SYNC[0][to];
  for (let j = 1; j < SYNC.length; j++) {
    const p = SYNC[j - 1], q = SYNC[j];
    if (t <= q[from]) return lerp(p[to], q[to], (t - p[from]) / (q[from] - p[from]));
  }
  const l = SYNC[SYNC.length - 1]; return t - l[from] + l[to];
}
const toDesign = t => mapT(t, 0, 1), toReal = d => mapT(d, 1, 0);

function render(rt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; noShadow();
  const t = toDesign(rt);
  const i = sceneAt(t);
  // transitions run on real time so every cut has the same snappy length
  const TR = 0.42, k = prog(rt, toReal(SCENES[i].a), toReal(SCENES[i].a) + TR);
  if (i > 0 && k < 1) {
    // transition: new scene grows from a centred rounded card (cut-on-beat feel)
    drawScene(i - 1, SCENES[i].a - 0.001);
    const e = eExpo(k), w = lerp(120, W * 1.05, e), h = lerp(120, H * 1.05, e);
    ctx.save(); rr(CX - w / 2, 890 - h / 2, w, h, lerp(60, 0, e)); ctx.clip();
    drawScene(i, t); ctx.restore();
  } else drawScene(i, t);
  if (window.GRID) drawGrid();
}
// debug overlay of the Instagram grid (only with ?grid; never rendered into the video)
function drawGrid() {
  ctx.save(); ctx.fillStyle = 'rgba(255,40,10,0.35)';
  ctx.fillRect(0, 0, W, 115); ctx.fillRect(0, 1544, W, H - 1544); ctx.fillRect(0, 0, 46, H); ctx.fillRect(1033, 0, W - 1033, H);
  ctx.fillRect(313, 132, 449, 84); ctx.fillRect(886, 960, 134, 560);
  ctx.strokeStyle = 'rgba(0,160,255,0.8)'; ctx.lineWidth = 3; ctx.strokeRect(SAFE.x0, SAFE.y0, SW, SAFE.y1 - SAFE.y0);
  ctx.restore();
}
window.render = render; window.DURATION = DURATION;
window.GRID = location.search.includes('grid');
if (!location.search.includes('render')) {
  document.fonts.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
}
