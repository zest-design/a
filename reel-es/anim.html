<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1080, H = 1920, DURATION = 23.4; // internal timeline
const SLOW = 1.4;                            // playback is 40% slower than the internal timeline
const SCR_S = 930 / 1080, SCR_TOP = 390;     // inner stage y 216 lands at ~400
const stage = document.getElementById('stage');
const screenEl = document.createElement('div'); screenEl.className = 'screen'; stage.appendChild(screenEl);
const inner = document.createElement('div'); inner.className = 'inner'; screenEl.appendChild(inner);
inner.style.top = (400 - 216 * SCR_S - SCR_TOP) + 'px'; inner.style.transform = `scale(${SCR_S})`;

// ---------- helpers ----------
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };

const P = (t, a, b) => C((t - a) / (b - a));
const L = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3);
const eo5 = k => 1 - Math.pow(1 - k, 5);
const ei = k => k * k * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = (k, s = 1.70158) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const rel = e => { e.dataset.rel = 1; return e; };
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const ORANGE = '#E07A4F';
const SPARK = (size, color = ORANGE) => {
  let s = `<svg width="${size}" height="${size}" viewBox="-50 -50 100 100">`;
  const n = 11;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, r = i % 2 ? 36 : 47;
    s += `<line x1="${Math.cos(a) * 8}" y1="${Math.sin(a) * 8}" x2="${Math.cos(a) * r}" y2="${Math.sin(a) * r}" stroke="${color}" stroke-width="9" stroke-linecap="round"/>`;

};
const ICON = {
  menu: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M6 12h22M6 22h14" stroke="#ddd" stroke-width="3.4" stroke-linecap="round"/></svg>',
  edit: '<svg width="32" height="32" viewBox="0 0 32 32"><path d="M6 8v18h18M14 18l2-6 10-10 4 4-10 10z" fill="none" stroke="#ddd" stroke-width="2.8" stroke-linejoin="round"/></svg>',
  plus: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 5v24M5 17h24" stroke="#bbb" stroke-width="3.4" stroke-linecap="round"/></svg>',
  sliders: '<svg width="36" height="34" viewBox="0 0 36 34"><path d="M4 11h28M4 23h28" stroke="#bbb" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="11" r="4.5" fill="#222" stroke="#bbb" stroke-width="3"/><circle cx="24" cy="23" r="4.5" fill="#222" stroke="#bbb" stroke-width="3"/></svg>',
  mic: '<svg width="30" height="36" viewBox="0 0 30 36"><rect x="9" y="3" width="12" height="20" rx="6" fill="#bbb"/><path d="M4 17a11 11 0 0 0 22 0M15 28v5" stroke="#bbb" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
  up: c => `<svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 25V6M6 14l9-9 9 9" stroke="${c}" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  bag: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M7 12h20l-2 17H9z" fill="#fff"/><path d="M12 12V9a5 5 0 0 1 10 0v3" stroke="#fff" stroke-width="3" fill="none"/></svg>',
};

// ---------- posters ----------
function poster(kind) { return $('div', 'poster p-' + kind); }

// rough continents (lon, lat)
const LAND = [
  [[-168,66],[-140,70],[-110,72],[-80,72],[-62,60],[-55,50],[-66,44],[-75,35],[-81,25],[-90,29],[-97,26],[-97,18],[-88,15],[-83,9],[-79,8],[-86,13],[-92,15],[-105,20],[-112,30],[-118,34],[-124,40],[-124,48],[-135,58],[-152,58],[-165,60]],
  [[-50,60],[-42,60],[-20,70],[-20,80],[-45,83],[-65,78],[-55,68]],
  [[-80,9],[-72,12],[-62,10],[-50,0],[-35,-6],[-38,-13],[-40,-22],[-48,-26],[-58,-35],[-65,-42],[-68,-52],[-74,-52],[-73,-40],[-72,-30],[-70,-18],[-76,-13],[-81,-5],[-80,0],[-78,6]],
  [[-10,36],[-9,43],[-2,44],[-5,48],[2,51],[8,54],[10,58],[5,62],[15,69],[28,71],[40,67],[40,55],[30,46],[28,41],[22,38],[18,40],[12,44],[8,44],[3,43],[-1,37],[-6,36]],
  [[-6,50],[2,51],[0,54],[-3,58],[-6,57]],
  [[-17,21],[-10,30],[-5,36],[10,37],[20,32],[32,31],[35,28],[43,12],[51,12],[42,-2],[40,-15],[35,-25],[20,-35],[17,-29],[12,-17],[13,-6],[9,4],[-8,4],[-15,10]],
  [[28,41],[36,36],[35,30],[44,13],[55,17],[60,25],[67,24],[73,20],[77,8],[80,15],[88,22],[92,22],[98,16],[100,6],[104,1],[106,10],[109,15],[108,22],[117,24],[122,31],[120,40],[127,40],[130,43],[140,47],[142,55],[135,55],[155,60],[160,62],[175,65],[180,68],[180,72],[140,73],[110,77],[80,73],[68,70],[60,68],[50,68],[40,67],[40,55],[30,46]],
  [[130,31],[136,34],[141,36],[142,41],[141,45],[139,42],[134,34]],
  [[95,5],[106,-6],[116,-8],[125,-9],[120,-2],[118,5],[109,2]],
  [[114,-22],[122,-18],[131,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[135,-34],[129,-32],[115,-34]],
  [[44,-25],[50,-15],[49,-12],[44,-17]],
];
function inPoly(x, y, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}
const D2R = Math.PI / 180;
const HUB = [-3.7, 40.4];
const DEST = [[-99.1,19.4,'Ciudad de México'],[-74.1,4.7,'Bogotá'],[-58.4,-34.6,'Buenos Aires'],[-46.6,-23.5,''],[-74,40.7,''],[3.4,6.5,'Lagos'],[-77,-12,''],[18.4,-33.9,''],[-70.6,-33.4,''],[-80.2,25.8,''],[-17.4,14.7,'']];
const vec = (lon, lat) => [Math.cos(lat * D2R) * Math.cos(lon * D2R), Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R)];
const HUBV = vec(...HUB);
const GLOBE_PTS = [];
for (let lat = -78; lat <= 82; lat += 2.1) {
  const step = 2.1 / Math.max(.2, Math.cos(lat * D2R));
  for (let lon = -180; lon < 180; lon += step) {
    const land = LAND.some(p => inPoly(lon, lat, p));
    const v = vec(lon, lat);
    const hubA = Math.acos(C(v[0] * HUBV[0] + v[1] * HUBV[1] + v[2] * HUBV[2], -1, 1));
    GLOBE_PTS.push({ lon, cl: Math.cos(lat * D2R), sl: Math.sin(lat * D2R), land, hubA });
  }
}

function Globe() {
  const r = poster('globe');
  $('div', 'gl-glow', r);
  const cv = $('canvas', '', r); cv.width = W; cv.height = H; css(cv, { position: 'absolute', left: 0, top: 0 });
  const lab = rel($('div', 'center mono gl-lab', r, 'PEDIDOS ENVIADOS'));
  const num = rel($('div', 'center gl-num', r));
  const ctx = cv.getContext('2d');
  const CX = 540, CY = 1000, R = 330;
  return { root: r, update(lt) {
    const lon0 = -36 + 7 * lt, lat0 = 16;
    const cl0 = Math.cos(lat0 * D2R), sl0 = Math.sin(lat0 * D2R);
    const proj = (lon, cl, sl, k = 1) => {
      const dl = (lon - lon0) * D2R;
      const x = cl * Math.sin(dl), y = cl0 * sl - sl0 * cl * Math.cos(dl), z = sl0 * sl + cl0 * cl * Math.cos(dl);
      return [CX + R * k * x, CY - R * k * y, z, x, y];
    };
    const reveal = eo(P(lt, 0, 1.0)) * Math.PI * 1.05;
    ctx.clearRect(0, 0, W, H);
    // sphere body
    const ent = eo(P(lt, 0, .5));
    ctx.globalAlpha = ent;
    const g = ctx.createRadialGradient(CX - 90, CY - 110, 40, CX, CY, R);
    g.addColorStop(0, '#FFFDF8'); g.addColorStop(1, '#E9E0D1');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(60,45,30,.35)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(60,45,30,.12)'; ctx.lineWidth = 1.5;
    for (let gl = -60; gl <= 60; gl += 30) { ctx.beginPath(); let pen = false; for (let lo = -180; lo <= 180; lo += 4) { const [sx, sy, z] = proj(lo, Math.cos(gl * D2R), Math.sin(gl * D2R)); if (z > 0) { pen ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); pen = true; } else pen = false; } ctx.stroke(); }
    for (let lo = -180; lo < 180; lo += 30) { ctx.beginPath(); let pen = false; for (let gl = -88; gl <= 88; gl += 4) { const [sx, sy, z] = proj(lo, Math.cos(gl * D2R), Math.sin(gl * D2R)); if (z > 0) { pen ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); pen = true; } else pen = false; } ctx.stroke(); }
    for (const p of GLOBE_PTS) {
      if (p.hubA > reveal) continue;
      const [sx, sy, z] = proj(p.lon, p.cl, p.sl);
      if (z <= 0) continue;
      const edge = C((reveal - p.hubA) * 6);
      if (p.land) { ctx.fillStyle = `rgba(43,38,34,${(.3 + .7 * z) * edge})`; ctx.beginPath(); ctx.arc(sx, sy, 2.7, 0, 6.3); ctx.fill(); }
      else { ctx.fillStyle = `rgba(120,100,80,${.12 * z * edge})`; ctx.fillRect(sx - 1, sy - 1, 2, 2); }
    }
    // arcs
    ctx.globalAlpha = 1;
    const hv = HUBV;
    DEST.forEach((d, i) => {
      const k = eio(P(lt, .4 + i * .08, 1.0 + i * .08));
      if (k <= 0) return;
      const b = vec(d[0], d[1]);
      const w = Math.acos(hv[0] * b[0] + hv[1] * b[1] + hv[2] * b[2]);
      ctx.beginPath(); let pen = false; let head = null;
      const N = 70;
      for (let s = 0; s <= N; s++) {
        const u = s / N * k;
        const a1 = Math.sin((1 - u) * w) / Math.sin(w), a2 = Math.sin(u * w) / Math.sin(w);
        const v = [a1 * hv[0] + a2 * b[0], a1 * hv[1] + a2 * b[1], a1 * hv[2] + a2 * b[2]];
        const lat = Math.asin(C(v[2], -1, 1)) / D2R, lon = Math.atan2(v[1], v[0]) / D2R;
        const h = 1 + Math.sin(Math.PI * u) * w * .2;
        const [sx, sy, z, x, y] = proj(lon, Math.cos(lat * D2R), Math.sin(lat * D2R), h);
        const vis = z > 0 || (x * x + y * y) * h * h > 1.0;
        if (vis) { pen ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); pen = true; head = [sx, sy]; } else pen = false;
      }
      ctx.strokeStyle = '#E2452F'; ctx.lineWidth = 4.5; ctx.setLineDash([14, 9]); ctx.lineDashOffset = -lt * 60; ctx.stroke(); ctx.setLineDash([]);
      if (head) {
        ctx.fillStyle = '#E2452F';
        ctx.beginPath(); ctx.arc(head[0], head[1], k < 1 ? 6 : 6.5, 0, 7); ctx.fill();
        if (k >= 1) {
          const pk = P(lt, 1.0 + i * .08, 1.5 + i * .08);
          if (pk < 1) { ctx.strokeStyle = `rgba(226,69,47,${1 - pk})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(head[0], head[1], 6 + pk * 26, 0, 7); ctx.stroke(); }
          if (d[2]) { ctx.font = '600 27px Inter'; ctx.fillStyle = `rgba(30,26,22,${P(lt, 1.0 + i * .08, 1.25 + i * .08) * .92})`; ctx.fillText(d[2], head[0] + 14, head[1] + 9); }
        }
      }
    });
    const [hx, hy] = proj(HUB[0], Math.cos(HUB[1] * D2R), Math.sin(HUB[1] * D2R));
    ctx.fillStyle = '#1E1A16'; ctx.beginPath(); ctx.arc(hx, hy, 9 * ent, 0, 7); ctx.fill();
    ctx.font = '700 29px Inter'; ctx.globalAlpha = P(lt, .3, .6); ctx.fillText('Madrid', hx + 16, hy - 12); ctx.globalAlpha = 1;
    // header

    const hk = eo(P(lt, 0, .45));
    css(lab, { opacity: hk, transform: `translateY(${(1 - hk) * 20}px)`, letterSpacing: L(.7, .38, hk) + 'em' });
    css(num, { opacity: hk, transform: `scale(${L(.9, 1, hk)})` });
  } };
}

function Day() {
  const r = poster('day');
  const lab = rel($('div', 'center mono dy-lab', r, 'PUBLICANDO CADA DÍA'));
  const big = rel($('div', 'dy-big anton', r));
  const dia = $('span', '', big, 'DÍA'); dia.style.color = '#fff';
  const tensW = $('div', 'wheel', big), onesW = $('div', 'wheel', big);
  const strip = n => `<div>${Array.from({ length: n }, (_, i) => `<span>${i % 10}</span>`).join('')}</div>`;
  tensW.innerHTML = strip(4); onesW.innerHTML = strip(11);
  const tensS = tensW.firstChild, onesS = onesW.firstChild;
  const cal = rel($('div', 'cal', r));
  [150, 510].forEach(x => css($('div', 'ring', cal), { left: x + 'px' }));
  $('div', 'cal-m anton', cal, 'ABRIL');
  'LMXJVSD'.split('').forEach((d, i) => css($('div', 'wd', cal, d), { left: (28 + i * 89) + 'px' }));
  const cells = [];

    const c = $('div', 'cell', cal, `<i>${d}</i><svg width="76" height="76" viewBox="0 0 76 76"><path d="M20 40 L33 53 L58 24" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="64" stroke-dashoffset="64"/></svg>`);
    css(c, { left: (34 + col * 89) + 'px', top: (166 + row * 98) + 'px' });

        while (q && q !== el) { if (getComputedStyle(q).overflow === 'hidden') { const qb = q.getBoundingClientRect(); cr = { left: Math.max(cr.left, qb.left), top: Math.max(cr.top, qb.top), right: Math.min(cr.right, qb.right), bottom: Math.min(cr.bottom, qb.bottom) }; } q = q.parentElement; }
        if (cr.right - cr.left < 1 || cr.bottom - cr.top < 1) continue;
        u = u ? { left: Math.min(u.left, cr.left), top: Math.min(u.top, cr.top), right: Math.max(u.right, cr.right), bottom: Math.max(u.bottom, cr.bottom) } : cr;
      }
      if (!u) return; b = u;
    }
    const R = { x0: Math.max(b.left, clipR.x0), y0: Math.max(b.top, clipR.y0), x1: Math.min(b.right, clipR.x1), y1: Math.min(b.bottom, clipR.y1) };
    if (R.x1 - R.x0 < 1 || R.y1 - R.y0 < 1) return;
    ZONES.forEach(z => { if (R.x0 < z.x1 && R.x1 > z.x0 && R.y0 < z.y1 && R.y1 > z.y0) out.push(`${z.n}: ${el.className} "${(el.textContent || '').trim().slice(0, 30)}" [${R.x0 | 0},${R.y0 | 0},${R.x1 | 0},${R.y1 | 0}]`); });
  });
  return out;
};

render(+(new URLSearchParams(location.search).get('t') || 0) * SLOW);
