  return { root: r, update(lt) {
    const lon0 = -36 + 7 * lt, lat0 = 16;
    const cl0 = Math.cos(lat0 * D2R), sl0 = Math.sin(lat0 * D2R);
    const proj = (lon, cl, sl, k = 1) => {
      const dl = (lon - lon0) * D2R;
      const x = cl * Math.sin(dl), y = cl0 * sl - sl0 * cl * Math.cos(dl), z = sl0 * sl + cl0 * cl * Math.cos(dl);

    ctx.clearRect(0, 0, W, H);

    const ent = eo(P(lt, 0, .5));

    for (const p of GLOBE_PTS) {

      if (z <= 0) continue;

      else { ctx.fillStyle = `rgba(120,100,80,${.12 * z * edge})`; ctx.fillRect(sx - 1, sy - 1, 2, 2); }

      }
      ctx.strokeStyle = '#E2452F'; ctx.lineWidth = 4.5; ctx.setLineDash([14, 9]); ctx.lineDashOffset = -lt * 60; ctx.stroke(); ctx.setLineDash([]);
      if (head) {

        ctx.beginPath(); ctx.arc(head[0], head[1], k < 1 ? 6 : 6.5, 0, 7); ctx.fill();
        if (k >= 1) {
          const pk = P(lt, 1.0 + i * .08, 1.5 + i * .08);
          if (pk < 1) { ctx.strokeStyle = `rgba(226,69,47,${1 - pk})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(head[0], head[1], 6 + pk * 26, 0, 7); ctx.stroke(); }
          if (d[2]) { ctx.font = '600 27px Inter'; ctx.fillStyle = `rgba(30,26,22,${P(lt, 1.0 + i * .08, 1.25 + i * .08) * .92})`; ctx.fillText(d[2], head[0] + 14, head[1] + 9); }
        }

    ctx.fillStyle = '#1E1A16'; ctx.beginPath(); ctx.arc(hx, hy, 9 * ent, 0, 7); ctx.fill();

      tiles.push({ up: t.children[0].firstChild, lo: t.children[1].firstChild, fa: t.children[2], fb: t.children[3], fas: t.children[2].firstChild, fbs: t.children[3].firstChild });

  const wn = wait.querySelector('.wn');
  const START = 3 * 86400 + 12 * 3600 + 45 * 60 + 10, STEP = .17;
  const digs = s => { const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60, se = s % 60; return [d, h, m, se].map(v => String(v).padStart(2, '0')).join(''); };

  cText.innerHTML = txt + `<span class="caret" style="opacity:${blink ? 1 : 0}"></span>`;
  const press = P(t, s.send - .12, s.send - .04) - P(t, s.send - .04, s.send + .04);
  sendB.style.transform = `scale(${1 - press * .12})`;
  // popup
  const pk = eo(P(t, s.typeA, s.typeA + .15)) * (1 - P(t, s.auto + .05, s.auto + .2));
  css(popup, { top: (cTop - 140) + 'px', opacity: pk, transform: `translateY(${(1 - pk) * 20}px)`, background: t > s.auto - .08 && t < s.auto + .1 ? '#33302D' : '' });
  popup.children[0].textContent = s.cmd; popup.children[1].textContent = s.desc;
  // keyboard
  const kk = eio(P(t, s.send, s.send + .32));
  kbd.style.transform = `translateY(${kk * 620}px)`;
  kbd.style.display = kk >= 1 ? 'none' : '';
  sugg.querySelector('.s0').textContent = txt ? `“${txt.replace('/', '')}”` : '';
  // key pop for each typed char
  kpop.style.display = 'none';
  for (let i = 0; i < s.typed; i++) {
    const tc = s.typeA + i * .075;
    if (t >= tc && t < tc + .07) {
      const ch = s.cmd[i]; const p = KEYPOS[ch];
      if (p) { kpop.style.display = ''; css(kpop, { left: (p[0] - 12) + 'px', top: (p[1] - 70) + 'px' }); kpop.textContent = ch; }
    }
  }
  // sent messages
  mChip.style.display = s.chip ? '' : 'none';
  if (s.chip) { mChip.innerHTML = `${s.chip}<span class="tag">PEGADO</span>`; const k = eback(P(t, s.send + .02, s.send + .34)); css(mChip, { opacity: C(k * 2), transform: `translateY(${(1 - k) * 60}px) scale(${L(.8, 1, C(k))})`, transformOrigin: '100% 100%' }); }
  mCmd.textContent = s.cmd;
  const ck = eback(P(t, s.send + .06, s.send + .38));
  css(mCmd, { top: (s.chip ? 494 : 360) + 'px', opacity: C(ck * 2), transform: `translateY(${(1 - ck) * 70}px)` });
  const lk = P(t, s.send + .14, s.send + .3);
  css(mLine, { top: (s.chip ? 582 : 448) + 'px', opacity: lk });
  const lineTxt = s.greet ? 'Comenta “ANIMAR” y te envío los prompts' : `Animando con ${s.cmd.slice(1)}…`;
  mTx.textContent = lineTxt.slice(0, Math.ceil(lineTxt.length * eo(P(t, s.send + .14, s.send + .5))));
  mSp.firstChild.style.transform = `rotate(${t * 220}deg)`;
  bbar.style.opacity = P(t, s.send + .15, s.send + .35);
  // card
  const cy = s.chip ? 640 : 506;
  const ak = eo(P(t, s.card, s.card + .28));
  css(card, { top: cy + 'px', display: t < s.card || t > s.full + FULL_D ? 'none' : '', opacity: C(ak * 2), clipPath: `inset(0 0 ${(1 - ak) * 100}% 0 round 26px)` });
  card.style.visibility = (t > s.full && s.enter !== 'reveal' && s.enter !== 'wipe' && s.enter !== 'drop') ? 'hidden' : 'visible';
  const ld = P(t, s.content - .05, s.content + .25);
  cardDots.style.opacity = 1 - ld; cardShine.style.opacity = 1 - ld;
  cardShine.style.transform = `translateX(${((t * 1.6) % 1.4 - .7) * 428}px)`;
  css(s.cardP.root, { transform: `scale(${CARD.w / W})`, opacity: ld });
  if (t >= s.content - .05 && t <= s.full + FULL_D) s.cardP.update(t - s.content);
  CARD.y = cy;
}

function setFull(s, t, prevVisible) {
  const F = s.fullF, show = t >= s.full && t < s.end + EXIT_D;
  F.style.display = show ? '' : 'none';
  if (!show) return;
  s.fullP.update(t - s.content);
  const k = eio(P(t, s.full, s.full + FULL_D));
  let x = 0, y = 0, w = W, h = H, rad = 0, tr = '', clip = 'none', op = 1, filt = 'none';
  const cr = { ...CARD, y: s.chip ? 640 : 506 };
  const morph = kk => { x = L(cr.x, 0, kk); y = L(cr.y, 0, kk); w = L(cr.w, W, kk); h = L(cr.h, H, kk); rad = L(26, 0, kk); };
  switch (s.enter) {
    case 'morph': morph(k); break;
    case 'tilt': morph(k); tr = `perspective(2000px) rotateY(${(1 - k) * 22}deg)`; break;
    case 'reveal': clip = `inset(${L(cr.y, 0, k)}px ${L(W - cr.x - cr.w, 0, k)}px ${L(H - cr.y - cr.h, 0, k)}px ${L(cr.x, 0, k)}px round ${L(26, 0, k)}px)`; break;
    case 'rise': { const q = eo(P(t, s.full, s.full + FULL_D)); tr = `translateY(${(1 - q) * H}px) scale(${L(.9, 1, q)})`; rad = L(40, 0, q); break; }
    case 'drop': { const q = eback(P(t, s.full, s.full + FULL_D + .1), .8); tr = `translateY(${(1 - q) * -H}px)`; break; }
    case 'wipe': clip = `inset(0 ${(1 - k) * 100}% 0 0)`; break;
  }
  // exit (covering next chat)
  if (t >= s.end) {
    const e = eio(P(t, s.end, s.end + EXIT_D));
    switch (s.exit) {
      case 'fadezoom': tr = `scale(${L(1, 1.12, e)})`; op = 1 - e; filt = `blur(${e * 14}px)`; break;
      case 'minimize': { x = L(0, CARD.x, e); y = L(0, 640, e); w = L(W, CARD.w, e); h = L(H, CARD.h, e); rad = L(0, 26, e); op = 1 - P(t, s.end + .2, s.end + EXIT_D); break; }
      case 'slideleft': tr = `translateX(${-e * W}px)`; break;
      case 'unlock': tr = `translateY(${-e * H}px)`; break;
      case 'iris': clip = `circle(${L(1200, 0, e)}px at 540px 960px)`; break;
      case 'fade': op = 1 - e; break;
    }
  }
  css(F, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: rad + 'px', transform: tr || 'none', clipPath: clip, opacity: op, filter: filt, transformOrigin: '50% 50%' });
  css(s.fullP.root, { transform: `scale(${w / W})` });
}

function render(tReal) {
  const t = tReal / SLOW;
  // persistent headline: intro, then a small pulse on the orange line each time a prompt is sent
  ptWords.forEach((w, i) => { const k = eback(P(t, .05 + i * .07, .45 + i * .07)); css(w, { opacity: C(k * 2), transform: `translateY(${(1 - k) * 36}px)` }); });
  const ek = eo(P(t, .35, .8));
  let pulse = 0; SC.forEach(s => { pulse = Math.max(pulse, Math.sin(Math.PI * P(t, s.send, s.send + .35))); });
  css(ptEm, { opacity: ek, transform: `translateY(${(1 - ek) * 30}px) scale(${1 + pulse * .045})` });
  let cur = 0;
  SC.forEach((s, i) => { if (t >= s.t0) cur = i; });
  setChat(SC[cur], t);
  SC.forEach(s => setFull(s, t));
}
window.inTransition = tr => { const t = tr / SLOW; return SC.some(s => (t >= s.full - .02 && t <= s.full + FULL_D + .12) || (t >= s.end - .02 && t <= s.end + EXIT_D + .02) || (t >= s.send - .05 && t <= s.send + .45)); };
window.render = render; window.DURATION = DURATION * SLOW;

// ---------- safe-zone check ----------
const ZONES = [
  { n: 'topo', x0: 0, y0: 0, x1: W, y1: 115 }, { n: 'base', x0: 0, y0: 1544, x1: W, y1: H },
  { n: 'esq', x0: 0, y0: 0, x1: 46, y1: H }, { n: 'dir', x0: 1033, y0: 0, x1: W, y1: H },
  { n: 'bloco-topo', x0: 313, y0: 132, x1: 762, y1: 216 }, { n: 'icones', x0: 886, y0: 960, x1: 1020, y1: 1520 },
];
window.checkSafe = () => {
  const out = [];
  document.querySelectorAll('[data-rel]').forEach(el => {
    let op = 1, a = el, clipR = { x0: 0, y0: 0, x1: W, y1: H }, hidden = false;
    while (a && a !== stage) {
      const cs = getComputedStyle(a);
      if (cs.display === 'none' || cs.visibility === 'hidden') { hidden = true; break; }
      op *= +cs.opacity;
      if (a !== el && (cs.overflow === 'hidden' || cs.clipPath !== 'none')) { const b = a.getBoundingClientRect(); clipR = { x0: Math.max(clipR.x0, b.left), y0: Math.max(clipR.y0, b.top), x1: Math.min(clipR.x1, b.right), y1: Math.min(clipR.y1, b.bottom) }; }
      if (a.classList.contains('kbd')) { hidden = true; break; }
      a = a.parentElement;
    }
    if (hidden || op < .05) return;
    let b = el.getBoundingClientRect();
    if (el.classList.contains('center') || el.classList.contains('greet') || el.classList.contains('dy-big')) {
      const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n, u = null;
      while ((n = tw.nextNode())) {
        if (!n.textContent.trim()) continue;
        const rg = document.createRange(); rg.selectNodeContents(n);
        let cr = rg.getBoundingClientRect(); let q = n.parentElement;
        while (q && q !== el) { if (getComputedStyle(q).overflow === 'hidden') { const qb = q.getBoundingClientRect(); cr = { left: Math.max(cr.left, qb.left), top: Math.max(cr.top, qb.top), right: Math.min(cr.right, qb.right), bottom: Math.min(cr.bottom, qb.bottom) }; } q = q.parentElement; }
        if (cr.right - cr.left < 1 || cr.bottom - cr.top < 1) continue;
        u = u ? { left: Math.min(u.left, cr.left), top: Math.min(u.top, cr.top), right: Math.max(u.right, cr.right), bottom: Math.max(u.bottom, cr.bottom) } : cr;
      }
      if (!u) return; b = u;
    }
    const R = { x0: Math.max(b.left, clipR.x0), y0: Math.max(b.top, clipR.y0), x1: Math.min(b.right, clipR.x1), y1: Math.min(b.bottom, clipR.y1) };
    if (R.x1 - R.x0 < 1 || R.y1 - R.y0 < 1) return;
    ZONES.forEach(z => { if (R.x0 < z.x1 && R.x1 > z.x0 && R.y0 < z.y1 && R.y1 > z.y0) out.push(`${z.n}: ${el.className} "${(el.textContent || '').trim().slice(0, 30)}" [${R.x0 | 0},${R.y0 | 0},${R.x1 | 0},${R.y1 | 0}]`); });
  });
  return out;
};
if (location.search.includes('guides')) ZONES.forEach(z => css($('div', 'guide', stage), { left: z.x0 + 'px', top: z.y0 + 'px', width: (z.x1 - z.x0) + 'px', height: (z.y1 - z.y0) + 'px' }));
render(+(new URLSearchParams(location.search).get('t') || 0) * SLOW);
</script>
