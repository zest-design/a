<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Claseflix · Instagram Agent Skill</title>
<style>
  @font-face { font-family: 'D'; src: local('Inter Display Black'), local('InterDisplay-Black'); font-weight: 900; }
  @font-face { font-family: 'D'; src: local('Inter Display ExtraBold'), local('InterDisplay-ExtraBold'); font-weight: 800; }
  @font-face { font-family: 'D'; src: local('Inter Display Bold'), local('InterDisplay-Bold'); font-weight: 700; }
  @font-face { font-family: 'D'; src: local('Inter Display SemiBold'), local('InterDisplay-SemiBold'); font-weight: 600; }
  :root { --red: #DA0B22; --red2: #FF3B45; --mag: #B5287E; --pur: #6E1A4F; --cream: #F8F4F0; --ink: #1B1B1F; --blush: #FBE0E3; --ok: #1E9E5A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); font-family: 'D', sans-serif; color: var(--ink); }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: none; }
  .title { position: absolute; left: 60px; right: 60px; top: 230px; text-align: center; z-index: 5; }
  .sm { font-weight: 800; font-size: 58px; letter-spacing: -0.02em; line-height: 1.05; }
  .big { font-weight: 900; font-size: 128px; letter-spacing: -0.035em; line-height: 0.98; color: var(--red); white-space: nowrap; display: inline-block; }
  .line { display: block; }
  .w { display: inline-block; will-change: transform, filter, opacity; }
  .card { position: absolute; background: #fff; border-radius: 40px; box-shadow: 0 24px 60px rgba(60,10,20,.12); }
  .card .hd { display: flex; align-items: center; gap: 18px; padding: 30px 36px 0; font-weight: 800; font-size: 40px; }
  .ig { width: 64px; height: 64px; border-radius: 18px; background: radial-gradient(circle at 30% 110%, #FFD06A 0%, #F5733A 25%, #E1306C 50%, #A33BC2 80%, #5B51D8 100%); display: flex; align-items: center; justify-content: center; flex: none; }
  .ig svg { width: 62%; height: 62%; }
  .cl { width: 64px; height: 64px; border-radius: 18px; background: #1B1B1F; display: flex; align-items: center; justify-content: center; flex: none; }
  .cl svg { width: 64%; height: 64%; }
  .ic { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex: none; background: linear-gradient(145deg, var(--red2), var(--red) 55%, var(--mag)); }
  .ic svg { width: 58%; height: 58%; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 999px; font-weight: 800; font-size: 30px; white-space: nowrap; }
  .pill.ok { background: #E3F5EA; color: var(--ok); }
  .pill.red { background: var(--red); color: #fff; }
  .row { display: flex; align-items: center; gap: 22px; padding: 22px 36px; font-weight: 800; font-size: 40px; border-top: 2px solid #F1ECE8; }
  .row .grow { flex: 1; }
  /* captions */
  #cap { position: absolute; left: 0; right: 0; top: 1088px; text-align: center; z-index: 20; }
  #cap span.box { display: inline-block; background: rgba(27,27,31,.92); color: #fff; font-weight: 900; font-size: 60px; letter-spacing: -0.01em; padding: 14px 34px 18px; border-radius: 26px; white-space: nowrap; }
  #cap b { color: #FF4152; font-weight: 900; }
  /* host */
  #host { position: absolute; left: 50%; width: 640px; margin-left: -320px; top: 1170px; transform-origin: 50% 100%; z-index: 10; }
  #host img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .shadowfloor { position: absolute; left: 140px; right: 140px; top: 1150px; height: 900px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #F9CDD2 0%, #FBE0E3 45%, rgba(251,224,227,0) 70%); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
window.DURATION = 58.2;
const stage = document.getElementById('stage');
const cl = x => Math.max(0, Math.min(1, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = x => { x = cl(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const h = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
function rv(el, t, a, o = {}) {
  const d = o.d ?? 0.4, y = o.y ?? 40, bl = o.blur ?? 14;
  const p = cl((t - a) / d), e = eo(p);
  el.style.opacity = p <= 0 ? 0 : Math.min(1, p * 1.8);
  el.style.transform = `translateY(${(1 - e) * y}px) scale(${o.scale ? lerp(o.scale, 1, e) : 1})`;
  el.style.filter = `blur(${(1 - e) * bl}px)`;
}
function pop(el, t, a, o = {}) {
  const p = cl((t - a) / (o.d ?? 0.45));
  el.style.opacity = p <= 0 ? 0 : Math.min(1, p * 3);
  el.style.transform = `${o.pre || ''} scale(${p <= 0 ? 0 : eb(p)}) rotate(${(1 - eo(p)) * (o.rot ?? 0)}deg)`;
}
const words = s => s.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
function fit(el, maxW) { const fs = parseFloat(getComputedStyle(el).fontSize); if (el.scrollWidth > maxW) el.style.fontSize = (fs * maxW / el.scrollWidth) + 'px'; }

/* ---------- icons ---------- */
const S = 'fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"';
const IC = {
  igcam: `<svg viewBox="0 0 100 100" ${S}><rect x="16" y="16" width="68" height="68" rx="20"/><circle cx="50" cy="50" r="16"/><circle cx="70" cy="30" r="3" fill="#fff"/></svg>`,
  spark: `<svg viewBox="0 0 100 100"><path d="M50 8 L57 40 L90 50 L57 60 L50 92 L43 60 L10 50 L43 40Z" fill="#fff"/></svg>`,
  pen: `<svg viewBox="0 0 100 100" ${S}><path d="M22 78l6-20 38-38 14 14-38 38z"/><path d="M58 28l14 14"/></svg>`,
  chat: `<svg viewBox="0 0 100 100" ${S}><path d="M18 24h64v40H44L28 78V64H18z"/></svg>`,
  reply: `<svg viewBox="0 0 100 100" ${S}><path d="M42 26L18 48l24 22"/><path d="M20 48h38c14 0 24 10 24 26"/></svg>`,
  user: `<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="36" r="16"/><path d="M20 84c4-18 16-26 30-26s26 8 30 26"/></svg>`,
  cal: `<svg viewBox="0 0 100 100" ${S}><rect x="16" y="22" width="68" height="62" rx="12"/><path d="M16 42h68M34 14v16M66 14v16"/></svg>`,
  fire: `<svg viewBox="0 0 100 100"><path d="M52 8c4 18 26 26 26 50 0 18-13 32-28 32S22 76 22 58c0-14 8-22 14-28 0 10 6 16 12 16-4-16 0-28 4-38z" fill="#fff"/></svg>`,
  hook: `<svg viewBox="0 0 100 100" ${S}><path d="M60 14v44c0 14-10 24-22 24S16 72 16 60"/><path d="M16 60l10-8"/></svg>`,
  script: `<svg viewBox="0 0 100 100" ${S}><rect x="20" y="12" width="60" height="76" rx="10"/><path d="M34 34h32M34 50h32M34 66h20"/></svg>`,
  grid: `<svg viewBox="0 0 100 100" ${S}><rect x="16" y="16" width="28" height="28" rx="6"/><rect x="56" y="16" width="28" height="28" rx="6"/><rect x="16" y="56" width="28" height="28" rx="6"/><rect x="56" y="56" width="28" height="28" rx="6"/></svg>`,
  chart: `<svg viewBox="0 0 100 100" ${S}><path d="M18 80h66"/><path d="M28 70V54M46 70V40M64 70V28"/></svg>`,
  heart: `<svg viewBox="0 0 100 100" ${S}><path d="M50 82S16 62 16 38c0-12 9-20 19-20 7 0 12 4 15 9 3-5 8-9 15-9 10 0 19 8 19 20 0 24-34 44-34 44z"/></svg>`,
  play: `<svg viewBox="0 0 100 100"><path d="M34 22l44 28-44 28z" fill="#fff"/></svg>`,
  search: `<svg viewBox="0 0 100 100" ${S}><circle cx="44" cy="44" r="24"/><path d="M62 62l20 20"/></svg>`,
  link: `<svg viewBox="0 0 100 100" ${S}><path d="M42 58l16-16"/><path d="M36 48l-8 8a14 14 0 0 0 20 20l8-8"/><path d="M64 52l8-8a14 14 0 0 0-20-20l-8 8"/></svg>`,
  check: `<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M24 52l18 18 34-38"/></svg>`,
  q: `<svg viewBox="0 0 100 100" ${S}><path d="M36 36c0-10 6-16 14-16s14 6 14 14c0 12-14 12-14 24"/><circle cx="50" cy="76" r="3" fill="#fff"/></svg>`,
  clock: `<svg viewBox="0 0 100 100" ${S}><circle cx="50" cy="52" r="32"/><path d="M50 34v18l12 8"/></svg>`,
  mic: `<svg viewBox="0 0 100 100" ${S}><rect x="38" y="14" width="24" height="44" rx="12"/><path d="M26 48c0 14 10 24 24 24s24-10 24-24M50 72v14"/></svg>`,
  eye: `<svg viewBox="0 0 100 100" ${S}><path d="M10 50s16-26 40-26 40 26 40 26-16 26-40 26S10 50 10 50z"/><circle cx="50" cy="50" r="10"/></svg>`,
  send: `<svg viewBox="0 0 100 100"><path d="M14 50L86 18 70 84 50 60z" fill="#fff"/></svg>`,
};
const ig = (sz = 64) => `<div class="ig" style="width:${sz}px;height:${sz}px;border-radius:${sz * .28}px">${IC.igcam}</div>`;
const clI = (sz = 64) => `<div class="cl" style="width:${sz}px;height:${sz}px;border-radius:${sz * .28}px">${IC.spark}</div>`;
const icB = (k, sz = 64) => `<div class="ic" style="width:${sz}px;height:${sz}px;border-radius:${sz * .28}px">${IC[k]}</div>`;

/* ---------- static layers: floor glow, host, captions ---------- */
stage.appendChild(h(`<div class="shadowfloor"></div>`));
const host = h(`<div id="host"></div>`); stage.appendChild(host);
const POSES = ['talk', 'point', 'phone', 'stuck', 'down'];
const poseImg = {};
POSES.forEach(p => { const i = h(`<img src="assets/rapaz_${p}.png">`); host.appendChild(i); poseImg[p] = i; });
// pose timeline [start, pose]
const POSE_T = [[0, 'talk'], [5.45, 'point'], [13.25, 'talk'], [29.95, 'phone'], [41.05, 'stuck'], [44.35, 'talk'], [48.95, 'point'], [52.55, 'down']];
const cap = h(`<div id="cap"><span class="box"></span></div>`); stage.appendChild(cap);
const capBox = cap.querySelector('.box');
// captions (start time from the original edit's word-by-word subtitles); *x* = highlight
const CAPS = [[0.1, 'Claude acaba'], [0.8, 'de *matar*'], [1.3, '*Instagram*'], [1.8, 'ahora puedes'], [2.3, 'conectar *Claude* a'], [3.1, '*Instagram* y'], [3.6, 'gestionará'], [4.2, 'toda tu cuenta'], [5.1, 'por ti'],
  [5.5, 'la skill se'], [6.1, 'llama'], [6.4, '*Instagram Agent Skill*'], [7.8, 'y es completamente'], [8.8, '*gratuita*'], [9.4, 'no es una'], [10.0, 'sola skill'], [11.0, 'son *11*'], [11.6, 'y cada una'], [12.1, 'hace un trabajo'], [12.7, 'distinto'],
  [13.3, 'una escribe tus'], [13.9, '*publicaciones*'], [14.4, 'basándose en las'], [15.2, '*21 fórmulas*'], [16.0, 'de ganchos más'], [16.9, 'probadas'], [17.2, 'otra *comenta*'], [18.0, 'publicaciones de'], [18.9, 'otras personas por ti'],
  [20.1, 'otra se encarga'], [20.7, 'de las *respuestas*'], [21.6, 'otra *optimiza*'], [22.5, 'tu perfil'], [23.4, 'otra *planifica*'], [24.4, 'tu semana entera'], [25.4, 'de Instagram'], [26.1, 'y así te'], [26.6, 'ayuda a saber'],
  [27.4, '*qué* publicar'], [28.0, '*cuándo* publicar y'], [28.9, '*con quién*'], [29.4, 'interactuar'], [30.2, 'lo más loco'], [31.0, 'de esta skill'], [31.7, 'de *viralidad*'], [32.5, 'así llamémosla'], [33.8, 'es que encuentra'], [34.6, 'los *reels*'],
  [35.5, 'con mejor'], [35.9, '*rendimiento* de tu'], [36.7, 'nicho'], [37.1, 'te analiza por'], [37.9, 'qué funcionan'], [38.5, 'convierte esas'], [39.2, 'ideas en *guiones*'], [40.2, '*originales* para ti'], [41.1, 'de esa forma'], [41.7, 'tú nunca te'],
  [42.4, 'quedas *atascado*'], [43.6, 'pensando en qué'], [44.4, 'publicar'], [45.0, 'cuándo publicar'], [45.8, 'qué videos son'], [46.4, '*virales*'], [46.9, 'qué voz poner'], [47.6, 'y quién es'], [48.1, 'tu *audiencia*'],
  [49.0, 'para'], [49.3, 'configurarlo'], [50.1, 'solo ve a'], [50.7, '*Claude* y pega'], [51.7, 'este *enlace*'], [52.6, 'y si'], [53.0, 'quieres la'], [53.4, 'configuración'], [53.9, 'completa'], [54.3, 'el paso a'], [54.8, 'paso detallado'],
  [55.7, 'comenta aquí abajo'], [56.7, '*99*'], [57.6, 'y te lo'], [57.9, 'hago llegar']];
CAPS.forEach(c => c[2] = c[1].replace(/\*([^*]+)\*/g, '<b>$1</b>'));

/* ---------- scenes (top panel area: y 0–1060) ---------- */
const scenes = [];
function scene(s, e, build, update) {
  const el = document.createElement('div'); el.className = 'scene'; stage.insertBefore(el, host);
  scenes.push({ s, e, el, ctx: build(el) || {}, update });
}
function title(el, sm, big, top = 230) {
  const t = h(`<div class="title" style="top:${top}px">${sm ? `<div class="line sm">${words(sm)}</div>` : ''}${big ? `<div class="line"><span class="big">${words(big)}</span></div>` : ''}</div>`);
  el.appendChild(t);
  return { t, sm: [...t.querySelectorAll('.sm .w')], big: [...t.querySelectorAll('.big .w')], bigEl: t.querySelector('.big') };
}
function playT(T, t, a, b, st = 0.08) { T.sm.forEach((w, i) => rv(w, t, a + i * st, { y: 26, blur: 10, d: .32 })); T.big.forEach((w, i) => rv(w, t, b + i * 0.1, { y: 60, blur: 18, d: .42 })); }
const push = (el, t, s, e, amt = .03) => el.style.transform = `scale(${1 + amt * cl((t - s) / (e - s))})`;

/* 1 · Hook 0–1.75 */
scene(0, 1.75, el => {
  const T = title(el, 'Claude acaba de', 'MATAR Instagram', 300);
  const icon = h(`<div class="abs" style="left:420px;top:600px;width:240px;height:240px">${ig(240)}</div>`); el.appendChild(icon);
  const x = h(`<svg class="abs" style="left:380px;top:560px;width:320px;height:320px;overflow:visible" viewBox="0 0 100 100"><path id="x1" d="M14 14L86 86" stroke="#DA0B22" stroke-width="12" stroke-linecap="round"/><path id="x2" d="M86 14L14 86" stroke="#DA0B22" stroke-width="12" stroke-linecap="round"/></svg>`); el.appendChild(x);
  return { T, icon, x1: x.querySelector('#x1'), x2: x.querySelector('#x2') };
}, (c, t) => {
  playT(c.T, t, 0.08, 0.8);
  pop(c.icon, t, 0.15, { rot: -10 });
  const sh = t > 1.3 && t < 1.6 ? Math.sin(t * 90) * 10 : 0;
  c.icon.style.transform += ` translateX(${sh}px)`;
  [c.x1, c.x2].forEach((p, i) => { p.style.strokeDasharray = 110; p.style.strokeDashoffset = 110 * (1 - eo((t - 1.3 - i * .12) / .22)); });
});

/* 2 · Connect 1.75–3.55 */
scene(1.75, 3.55, el => {
  const T = title(el, 'Conecta', 'Claude + Instagram');
  const a = h(`<div class="abs" style="left:150px;top:560px;text-align:center">${clI(200)}<div class="sm" style="font-size:40px;margin-top:16px">Claude</div></div>`);
  const b = h(`<div class="abs" style="left:730px;top:560px;text-align:center">${ig(200)}<div class="sm" style="font-size:40px;margin-top:16px">Instagram</div></div>`);
  const ln = h(`<svg class="abs" style="left:360px;top:650px;width:360px;height:20px" viewBox="0 0 360 20"><path id="l" d="M10 10H350" stroke="#DA0B22" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round"/></svg>`);
  const ok = h(`<div class="abs" style="left:490px;top:620px;width:100px;height:100px;border-radius:50%;background:#1E9E5A;display:flex;align-items:center;justify-content:center">${IC.check}</div>`);
  ok.querySelector('svg').style.width = '60px';
  const lab = h(`<div class="abs" style="left:0;right:0;top:880px;text-align:center"><span class="pill ok" style="font-size:40px;padding:14px 30px">✓ Conectado</span></div>`);
  [a, b, ln, ok, lab].forEach(x => el.appendChild(x));
  return { T, a, b, ln, ok, lab };
}, (c, t) => {
  playT(c.T, t, 1.8, 2.3);
  pop(c.a, t, 2.3, { rot: -8 }); pop(c.b, t, 2.55, { rot: 8 });
  c.ln.style.clipPath = `inset(0 ${100 - eio((t - 2.7) / .4) * 100}% 0 0)`;
  c.ln.querySelector('#l').style.strokeDashoffset = -t * 60;
  pop(c.ok, t, 3.1); rv(c.lab, t, 3.15, { y: 20 });
});

/* 3 · Manages whole account 3.55–5.45 */
scene(3.55, 5.45, el => {
  const T = title(el, 'Gestiona toda', 'tu cuenta', 210);
  const card = h(`<div class="card" style="left:90px;right:90px;top:500px;padding-bottom:10px">
     <div class="hd">${ig(56)}Tu cuenta de Instagram</div><div style="height:22px"></div>
     ${[['pen', 'Publicaciones'], ['chat', 'Comentarios'], ['reply', 'Respuestas'], ['user', 'Perfil']].map(([k, n]) => `<div class="row">${icB(k, 56)}<span class="grow">${n}</span><span class="pill ok">✓ Claude</span></div>`).join('')}
   </div>`);
  el.appendChild(card);
  const stamp = h(`<div class="abs" style="left:640px;top:440px;transform-origin:50% 50%"><span class="pill red" style="font-size:44px;padding:14px 30px">¡Por ti!</span></div>`); el.appendChild(stamp);
  return { T, card, pills: [...card.querySelectorAll('.pill')], stamp };
}, (c, t) => {
  playT(c.T, t, 3.6, 4.2);
  rv(c.card, t, 3.6, { y: 80, blur: 8, d: .5 });
  c.pills.forEach((p, i) => pop(p, t, 4.2 + i * .2));
  pop(c.stamp, t, 5.1, { pre: 'rotate(-8deg)', rot: -20 });
});

/* 4 · Skill name + free 5.45–9.35 */
scene(5.45, 9.35, el => {
  const T = title(el, 'La skill se llama', '');
  const card = h(`<div class="card" style="left:90px;right:90px;top:420px;height:300px;display:flex;align-items:center;gap:36px;padding:0 50px">
     ${ig(170)}<div><div style="font-weight:900;font-size:66px;letter-spacing:-.02em;line-height:1">Instagram<br>Agent Skill</div><div style="margin-top:14px;font-weight:700;font-size:32px;color:#8a8580">Skill para Claude</div></div></div>`);
  el.appendChild(card);
  const free = h(`<div class="abs" style="left:0;right:0;top:790px;text-align:center"><span class="pill" style="background:#1E9E5A;color:#fff;font-size:76px;padding:22px 54px;border-radius:40px">100% GRATIS</span></div>`);
  el.appendChild(free);
  return { T, card, free };
}, (c, t) => {
  playT(c.T, t, 5.5, 99);
  pop(c.card, t, 6.35, { rot: -4 });
  pop(c.free, t, 8.75, { rot: 6 });
});

/* 5 · 11 skills 9.35–13.25 */
const SK = [['pen', 'Escribir'], ['chat', 'Comentar'], ['reply', 'Responder'], ['user', 'Perfil'], ['cal', 'Planificar'], ['fire', 'Viralidad'], ['hook', 'Ganchos'], ['script', 'Guiones'], ['grid', 'Cuadrícula'], ['chart', 'Métricas'], ['heart', 'Interacción']];
scene(9.35, 13.25, el => {
  const T1 = title(el, 'No es una', 'sola skill');
  const T2 = title(el, 'Son', '11 skills');
  const tiles = SK.map(([k, n], i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const x = 70 + col * 240 + (row === 2 ? 120 : 0), y = 540 + row * 170;
    const d = h(`<div class="card" style="left:${x}px;top:${y}px;width:220px;height:150px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${icB(k, 64)}<div style="font-weight:800;font-size:28px">${n}</div></div>`);
    el.appendChild(d); return d;
  });
  return { T1, T2, tiles };
}, (c, t) => {
  const first = t < 10.95;
  c.T1.t.style.display = first ? '' : 'none'; c.T2.t.style.display = first ? 'none' : '';
  if (first) playT(c.T1, t, 9.4, 10.0); else playT(c.T2, t, 11.0, 11.2);
  c.tiles.forEach((d, i) => pop(d, t, 11.0 + i * 0.1, { rot: i % 2 ? 8 : -8 }));
  // "cada una hace un trabajo distinto": wave highlight
  c.tiles.forEach((d, i) => { const k = Math.max(0, Math.sin((t - 12.1 - i * .07) * 6)) * (t > 12.1 && t < 13.1 ? 1 : 0); d.style.transform += ` translateY(${-k * 12}px)`; });
});

/* 6 · Writes posts 13.25–17.15 */
scene(13.25, 17.15, el => {
  const T = title(el, 'Escribe tus', 'publicaciones');
  const card = h(`<div class="card" style="left:90px;right:90px;top:520px;height:380px">
     <div class="hd">${icB('pen', 56)}Nueva publicación</div>

function updHost(t) {
  let cur = POSE_T[0], idx = 0;
  POSE_T.forEach((p, i) => { if (t >= p[0]) { cur = p; idx = i; } });
  POSES.forEach(p => poseImg[p].style.opacity = p === cur[1] ? 1 : 0);
  const since = t - cur[0];
  const sq = idx === 0 ? eb(t / .6) : 1 + 0.06 * Math.sin(cl(since / .3) * Math.PI); // pose switch squash
  const enter = idx === 0 ? (1 - eo(t / .6)) * 500 : 0;
  // talking bob: small bounce while speaking
  const bob = Math.sin(t * 7.5) * 4 + Math.sin(t * 2.1) * 6;
  host.style.transform = `translateY(${enter + bob}px) scale(${idx === 0 ? Math.max(.01, sq) : sq}, ${idx === 0 ? Math.max(.01, sq) : 2 - sq})`;
}
function updCap(t) {
  let c = null;
  for (let i = 0; i < CAPS.length; i++) { const nx = CAPS[i + 1] ? CAPS[i + 1][0] : 58.2; if (t >= CAPS[i][0] && t < Math.min(nx, CAPS[i][0] + 1.6)) { c = CAPS[i]; break; } }

  if (capBox.dataset.k !== String(c[0])) { capBox.innerHTML = c[2]; capBox.dataset.k = c[0]; }

  cap.style.opacity = 1; capBox.style.transform = `scale(${lerp(.85, 1, Math.min(1.1, p))})`;
}

  stage.querySelectorAll('.scene').forEach(s => s.style.display = 'block');
  stage.querySelectorAll('.big').forEach(b => fit(b, 960));
  stage.querySelectorAll('.scene').forEach(s => s.style.display = 'none');
  window.READY = true;
  if (!location.search.includes('render')) { const t0 = performance.now(); const f = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(f); }; f(); }
});
window.render = t => {
  for (const sc of scenes) { const on = t >= sc.s && t < sc.e; sc.el.style.display = on ? 'block' : 'none'; if (on) { sc.update(sc.ctx, t); push(sc.el, t, sc.s, sc.e, .025); } }
  updHost(t); updCap(t);
};
</script>
